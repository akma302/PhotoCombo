<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
  <title id="title">PhotoCombo design system — Graphite tone v0.6</title>
  <desc id="desc">Graphite palette with flat tonal focus and a 2 dp lower strip. No gradient or outer glow. This is a specification illustration.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #F0F0F5; }
      .heading { font-size: 16px; font-weight: 500; }
      .section { font-size: 14px; font-weight: 500; }
      .sub { fill: #A8AAB7; font-size: 12px; }
      .caption { fill: #A8AAB7; font-size: 11px; }
      .accent { fill: #DCE1E6; }
      .onaccent { fill: #1C2528; font-weight: 500; }
      .danger { fill: #E07894; }
      .line { stroke: #3B3D46; stroke-width: 1; }
      .glyph { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="focusInner" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#DCE1E6" stop-opacity=".14"/><stop offset="1" stop-color="#DCE1E6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="focusHalo" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#DCE1E6" stop-opacity=".35"/><stop offset=".5" stop-color="#DCE1E6" stop-opacity=".09"/><stop offset="1" stop-color="#DCE1E6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="whiteHalo" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#DCE1E6" stop-opacity=".35"/><stop offset=".5" stop-color="#DCE1E6" stop-opacity=".09"/><stop offset="1" stop-color="#DCE1E6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dangerInner" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#E07894" stop-opacity=".14"/><stop offset="1" stop-color="#E07894" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dangerHalo" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#E07894" stop-opacity=".35"/><stop offset=".5" stop-color="#E07894" stop-opacity=".09"/><stop offset="1" stop-color="#E07894" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="iconFocusShape"><rect width="34" height="34" rx="7"/></clipPath>
    <clipPath id="primaryFocusShape"><rect width="110" height="34" rx="7"/></clipPath>
    <clipPath id="fieldFocusShape"><rect y="11" width="232" height="34" rx="7"/></clipPath>
    <g id="check" class="glyph"><path d="M5 12l4 4L19 6"/></g>
    <g id="plus" class="glyph"><path d="M12 5v14M5 12h14"/></g>
    <g id="chevron" class="glyph"><path d="m6 9 6 6 6-6"/></g>
    <g id="trash" class="glyph"><path d="M4 6h16M9 6V4h6v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></g>
    <g id="undo" class="glyph"><path d="M8 5 3 10l5 5M3 10h10c5 0 7 3 7 7"/></g>
  </defs>
  <rect width="1120" height="850" fill="#202126"/>
  <text class="heading" x="32" y="42">PhotoCombo · Visual system</text>
  <text class="sub" x="32" y="65">Graphite tone / v0.6 · Flat focus / Ruby danger · Visual specification</text>
  <text class="section" x="32" y="107">Palette</text>

