  </g>
  <g transform="translate(630 296)">
    <g opacity=".36"><rect width="110" height="34" rx="7" fill="#DCE1E6"/><text class="onaccent" x="40" y="22">Save</text></g>
    <text class="caption" x="0" y="56">Disabled · 36%</text>
  </g>
  <g transform="translate(790 296)">
    <rect width="110" height="34" rx="7" fill="#DCE1E6"/>
    <path d="M17 12a6 6 0 1 1-4 7" fill="none" stroke="#1C2528" stroke-width="1.75" stroke-linecap="round"/>
    <text class="onaccent" x="33" y="22">Saving</text>
    <text class="caption" x="0" y="56">Busy · stable width</text>
  </g>
  <g transform="translate(940 296)">
    <rect width="148" height="34" rx="7" fill="#8B2744"/>
    <text x="18" y="22" style="fill:#F8EAF0;font-weight:500">Delete permanently</text>
    <text class="caption" x="0" y="56">DangerFilled · #8B2744</text>
  </g>
  <path class="line" d="M32 379h1056"/>

  <text class="section" x="32" y="414">Interaction states</text>
  <g transform="translate(32 434)">
    <use href="#undo" transform="translate(9 9) scale(.6667)" color="#F0F0F5"/>
    <text class="caption" x="0" y="58">Normal</text>
  </g>
  <g transform="translate(176 434)">
    <rect width="34" height="34" rx="7" fill="#35383E"/>
    <use href="#undo" transform="translate(9 9) scale(.6667)" color="#F0F0F5"/>
    <text class="caption" x="0" y="58">Hover</text>
  </g>
  <g transform="translate(320 434)">
    <rect width="34" height="34" rx="7" fill="#41454C"/>
    <use href="#undo" transform="translate(9 9) scale(.6667)" color="#F0F0F5"/>
    <text class="caption" x="0" y="58">Pressed</text>
  </g>
  <g transform="translate(464 434)">
    <rect width="34" height="34" rx="7" fill="#3A3C41"/>
    <g clip-path="url(#iconFocusShape)">
      <rect y="32" width="34" height="2" fill="#DCE1E6"/>
    </g>
    <use href="#undo" transform="translate(9 9) scale(.6667)" color="#F0F0F5"/>
    <text class="caption" x="-3" y="58">Keyboard · tonal focus</text>
  </g>
  <g transform="translate(650 434)">
    <rect width="110" height="34" rx="7" fill="#DCE1E6"/>
    <g clip-path="url(#primaryFocusShape)">
      <rect y="32" width="110" height="2" fill="#1C2528"/>
    </g>
    <text class="onaccent" x="40" y="22">Save</text>
    <text class="caption" x="0" y="58">Primary · keyboard</text>
  </g>
  <g transform="translate(814 434)">
    <rect width="224" height="34" rx="7" fill="#292B31" stroke="#3B3D46"/>
    <text x="11" y="22">Move one layer up</text>
    <text class="caption" x="0" y="58">Tooltip · same visual language</text>
  </g>
  <path class="line" d="M32 518h1056"/>

  <text class="section" x="32" y="553">Mode, commands and values</text>
  <g transform="translate(32 574)">
    <rect width="232" height="36" rx="9" fill="#202126" stroke="#3B3D46"/>
    <rect x="3" y="3" width="111" height="30" rx="7" fill="#292B31"/>
    <text class="accent" x="37" y="23">Frame</text><text x="155" y="23">Photo</text>
    <text class="caption" x="0" y="59">Persistent mode · one selected value</text>
  </g>
  <g transform="translate(300 575)">
    <rect x=".5" y=".5" width="72" height="33" rx="6.5" fill="#292B31" stroke="#3B3D46"/>
    <rect x="80.5" y=".5" width="72" height="33" rx="6.5" fill="#292B31" stroke="#3B3D46"/>
    <text x="27" y="22">Fit</text><text x="105" y="22">Fill</text>
    <text class="caption" x="0" y="58">One-time commands</text>
  </g>
  <g transform="translate(502 584)">
    <rect width="16" height="16" rx="3" fill="#DCE1E6"/>
    <use href="#check" transform="translate(0 0) scale(.6667)" color="#1C2528"/>
    <text x="26" y="13">Always fit</text>
    <text class="caption" x="0" y="49">Checked</text>
  </g>
  <g transform="translate(666 584)">
    <rect x=".5" y=".5" width="15" height="15" rx="3" fill="none" stroke="#A8AAB7"/>
    <text x="26" y="13">Always fit</text>
    <text class="caption" x="0" y="49">Unchecked</text>
  </g>
  <g transform="translate(852 575)">
    <rect x=".5" y=".5" width="185" height="33" rx="6.5" fill="#292B31" stroke="#3B3D46"/>
    <text x="12" y="22">16:9</text>
    <use href="#chevron" transform="translate(156 9) scale(.6667)" color="#A8AAB7"/>
    <text class="caption" x="0" y="58">Explicit selection</text>
  </g>
  <path class="line" d="M32 657h1056"/>

  <text class="section" x="32" y="692">Text and geometry</text>
  <g transform="translate(32 711)">
    <text class="sub" x="0" y="0">Combo name</text>
    <rect x=".5" y="11.5" width="231" height="33" rx="6.5" fill="#3A3C41" stroke="#3B3D46"/>
    <g clip-path="url(#fieldFocusShape)">
      <rect y="43" width="232" height="2" fill="#DCE1E6"/>
    </g>
    <text x="12" y="33">Music and light</text>
    <path d="M113 20v16" stroke="#DCE1E6" stroke-width="1"/>
