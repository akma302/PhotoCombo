  <rect x="912" y="126" width="30" height="30" rx="4" fill="#A8AAB7"/>
  <text x="952" y="137">Secondary</text><text class="caption" x="952" y="155">#A8AAB7</text>

  <rect x="32" y="183" width="30" height="30" rx="4" fill="#DCE1E6"/>
  <text x="72" y="194">Accent</text><text class="caption" x="72" y="212">#DCE1E6</text>
  <rect x="208" y="183" width="30" height="30" rx="4" fill="#1C2528"/>
  <text x="248" y="194">On accent</text><text class="caption" x="248" y="212">#1C2528</text>
  <rect x="384" y="183" width="30" height="30" rx="4" fill="#35383E"/>
  <text x="424" y="194">Hover</text><text class="caption" x="424" y="212">#35383E</text>
  <rect x="560" y="183" width="30" height="30" rx="4" fill="#41454C"/>
  <text x="600" y="194">Pressed</text><text class="caption" x="600" y="212">#41454C</text>
  <rect x="736" y="183" width="30" height="30" rx="4" fill="#E07894"/>
  <text x="776" y="194">Danger</text><text class="caption" x="776" y="212">#E07894</text>
  <rect x="912" y="183" width="30" height="30" rx="4" fill="#000000" fill-opacity=".4"/>
  <text x="952" y="194">Scrim</text><text class="caption" x="952" y="212">#00000066</text>
  <path class="line" d="M32 242h1056"/>

  <text class="section" x="32" y="277">Actions</text>
  <g transform="translate(32 296)">
    <rect width="110" height="34" rx="7" fill="#DCE1E6"/>
    <use href="#check" transform="translate(15 9) scale(.6667)" color="#1C2528"/>
