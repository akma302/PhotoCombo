    <text x="12" y="33">Untitled</text>
    <text class="danger" x="0" y="70" style="font-size:12px">Error message linked to the field</text>
  </g>
  <text class="sub" x="610" y="724">Focus fill / flat</text><text x="610" y="749">#3A3C41 / no gradient</text>
  <text class="sub" x="874" y="724">Controls / icons</text><text x="874" y="749">34 dp / 16 dp</text>
  <text class="caption" x="610" y="783">Lower strip 2 dp · no glow · unchanged hit regions</text>
  <text class="caption" x="32" y="828">DESIGN_SYSTEM.md is authoritative · Original runtime icons: Kotlin ImageVector · No external resources</text>
</svg>
