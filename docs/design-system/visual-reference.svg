  <text x="72" y="137">Workspace</text><text class="caption" x="72" y="155">#18191D</text>
  <rect x="208" y="126" width="30" height="30" rx="4" fill="#202126" stroke="#3B3D46"/>
  <text x="248" y="137">App</text><text class="caption" x="248" y="155">#202126</text>
  <rect x="384" y="126" width="30" height="30" rx="4" fill="#292B31"/>
  <text x="424" y="137">Panel</text><text class="caption" x="424" y="155">#292B31</text>
  <rect x="560" y="126" width="30" height="30" rx="4" fill="#3B3D46"/>
