<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
  <title id="title">PhotoCombo design system — Dark v0.1</title>
  <desc id="desc">Dark palette, button states, mode selector, action group, checkboxes, select and text fields. This is a specification illustration; runtime components and icons will be implemented in Compose.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #F0F0F5; }
      .heading { font-size: 16px; font-weight: 500; }
      .section { font-size: 14px; font-weight: 500; }
      .sub { fill: #A8AAB7; font-size: 12px; }
      .caption { fill: #A8AAB7; font-size: 11px; }
      .accent { fill: #B8A8FF; }
      .onaccent { fill: #24194B; font-weight: 500; }
      .danger { fill: #FF9CA5; }
      .line { stroke: #3B3D46; stroke-width: 1; }
      .glyph { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="check" class="glyph"><path d="M5 12l4 4L19 6"/></g>
    <g id="plus" class="glyph"><path d="M12 5v14M5 12h14"/></g>
    <g id="chevron" class="glyph"><path d="m6 9 6 6 6-6"/></g>
    <g id="trash" class="glyph"><path d="M4 6h16M9 6V4h6v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></g>
    <g id="undo" class="glyph"><path d="M8 5 3 10l5 5M3 10h10c5 0 7 3 7 7"/></g>
  </defs>
  <rect width="1120" height="850" fill="#202126"/>
  <text class="heading" x="32" y="42">PhotoCombo · Visual system</text>
  <text class="sub" x="32" y="65">Dark / v0.1 · Target specification · Component implementation follows separately</text>
  <text class="section" x="32" y="107">Palette</text>

  <rect x="32" y="126" width="30" height="30" rx="4" fill="#18191D"/>
  <text x="72" y="137">Workspace</text><text class="caption" x="72" y="155">#18191D</text>
  <rect x="208" y="126" width="30" height="30" rx="4" fill="#202126" stroke="#3B3D46"/>
  <text x="248" y="137">App</text><text class="caption" x="248" y="155">#202126</text>
  <rect x="384" y="126" width="30" height="30" rx="4" fill="#292B31"/>
  <text x="424" y="137">Panel</text><text class="caption" x="424" y="155">#292B31</text>
  <rect x="560" y="126" width="30" height="30" rx="4" fill="#3B3D46"/>
  <text x="600" y="137">Border</text><text class="caption" x="600" y="155">#3B3D46</text>
  <rect x="736" y="126" width="30" height="30" rx="4" fill="#F0F0F5"/>
  <text x="776" y="137">Text</text><text class="caption" x="776" y="155">#F0F0F5</text>
  <rect x="912" y="126" width="30" height="30" rx="4" fill="#A8AAB7"/>
  <text x="952" y="137">Secondary</text><text class="caption" x="952" y="155">#A8AAB7</text>

  <rect x="32" y="183" width="30" height="30" rx="4" fill="#B8A8FF"/>
  <text x="72" y="194">Accent</text><text class="caption" x="72" y="212">#B8A8FF</text>
  <rect x="208" y="183" width="30" height="30" rx="4" fill="#24194B"/>
  <text x="248" y="194">On accent</text><text class="caption" x="248" y="212">#24194B</text>
  <rect x="384" y="183" width="30" height="30" rx="4" fill="#3C3454"/>
  <text x="424" y="194">Hover</text><text class="caption" x="424" y="212">#3C3454</text>
  <rect x="560" y="183" width="30" height="30" rx="4" fill="#493C66"/>
  <text x="600" y="194">Pressed</text><text class="caption" x="600" y="212">#493C66</text>
  <rect x="736" y="183" width="30" height="30" rx="4" fill="#FF9CA5"/>
  <text x="776" y="194">Danger</text><text class="caption" x="776" y="212">#FF9CA5</text>
  <rect x="912" y="183" width="30" height="30" rx="4" fill="#000000" fill-opacity=".4"/>
  <text x="952" y="194">Scrim</text><text class="caption" x="952" y="212">#00000066</text>
  <path class="line" d="M32 242h1056"/>

  <text class="section" x="32" y="277">Actions</text>
  <g transform="translate(32 296)">
    <rect width="110" height="34" rx="7" fill="#B8A8FF"/>
    <use href="#check" transform="translate(15 9) scale(.6667)" color="#24194B"/>
    <text class="onaccent" x="43" y="22">Save</text>
    <text class="caption" x="0" y="56">Primary</text>
  </g>
  <g transform="translate(176 296)">
    <rect x=".5" y=".5" width="135" height="33" rx="6.5" fill="#292B31" stroke="#3B3D46"/>
    <use href="#plus" transform="translate(12 9) scale(.6667)" color="#F0F0F5"/>
    <text x="39" y="22">Add photo</text>
    <text class="caption" x="0" y="56">Secondary</text>
  </g>
  <g transform="translate(346 296)">
    <text x="10" y="22">Replace</text>
    <text class="caption" x="0" y="56">Ghost</text>
  </g>
  <g transform="translate(480 296)">
    <use href="#trash" transform="translate(8 9) scale(.6667)" color="#FF9CA5"/>
    <text class="danger" x="34" y="22">Delete</text>
    <text class="caption" x="0" y="56">Danger</text>
  </g>
  <g transform="translate(630 296)">
    <g opacity=".36"><rect width="110" height="34" rx="7" fill="#B8A8FF"/><text class="onaccent" x="40" y="22">Save</text></g>
    <text class="caption" x="0" y="56">Disabled · 36%</text>
  </g>
  <g transform="translate(790 296)">
    <rect width="110" height="34" rx="7" fill="#B8A8FF"/>
    <path d="M17 12a6 6 0 1 1-4 7" fill="none" stroke="#24194B" stroke-width="1.75" stroke-linecap="round"/>
    <text class="onaccent" x="33" y="22">Saving</text>
    <text class="caption" x="0" y="56">Busy · stable width</text>
  </g>
  <path class="line" d="M32 379h1056"/>

  <text class="section" x="32" y="414">Interaction states</text>
  <g transform="translate(32 434)">
    <use href="#undo" transform="translate(9 9) scale(.6667)" color="#F0F0F5"/>
    <text class="caption" x="0" y="58">Normal</text>
  </g>
  <g transform="translate(176 434)">
    <rect width="34" height="34" rx="7" fill="#3C3454"/>
    <use href="#undo" transform="translate(9 9) scale(.6667)" color="#F0F0F5"/>
    <text class="caption" x="0" y="58">Hover</text>
  </g>
  <g transform="translate(320 434)">
    <rect width="34" height="34" rx="7" fill="#493C66"/>
    <use href="#undo" transform="translate(9 9) scale(.6667)" color="#F0F0F5"/>
    <text class="caption" x="0" y="58">Pressed</text>
  </g>
  <g transform="translate(464 434)">
    <rect x="-3" y="-3" width="40" height="40" rx="10" fill="none" stroke="#B8A8FF" stroke-width="2"/>
    <use href="#undo" transform="translate(9 9) scale(.6667)" color="#F0F0F5"/>
    <text class="caption" x="-3" y="58">Keyboard focus</text>
  </g>
  <g transform="translate(650 434)">
    <g opacity=".36"><use href="#undo" transform="translate(9 9) scale(.6667)" color="#F0F0F5"/></g>
    <text class="caption" x="0" y="58">Disabled</text>
  </g>
  <g transform="translate(814 434)">
    <rect width="224" height="34" rx="7" fill="#292B31" stroke="#3B3D46"/>
    <text x="11" y="22">Move one layer up</text>
    <text class="caption" x="0" y="58">Tooltip · same visual language</text>
  </g>
  <path class="line" d="M32 518h1056"/>

  <text class="section" x="32" y="553">Mode, commands and values</text>
  <g transform="translate(32 574)">
    <rect width="232" height="36" rx="9" fill="#202126" stroke="#3B3D46"/>
    <rect x="3" y="3" width="111" height="30" rx="7" fill="#292B31"/>
    <text class="accent" x="37" y="23">Frame</text><text x="155" y="23">Photo</text>
    <text class="caption" x="0" y="59">Persistent mode · one selected value</text>
  </g>
  <g transform="translate(300 575)">
    <rect x=".5" y=".5" width="72" height="33" rx="6.5" fill="#292B31" stroke="#3B3D46"/>
    <rect x="80.5" y=".5" width="72" height="33" rx="6.5" fill="#292B31" stroke="#3B3D46"/>
    <text x="27" y="22">Fit</text><text x="105" y="22">Fill</text>
    <text class="caption" x="0" y="58">One-time commands</text>
  </g>
  <g transform="translate(502 584)">
    <rect width="16" height="16" rx="3" fill="#B8A8FF"/>
    <use href="#check" transform="translate(0 0) scale(.6667)" color="#24194B"/>
    <text x="26" y="13">Always fit</text>
    <text class="caption" x="0" y="49">Checked</text>
  </g>
  <g transform="translate(666 584)">
    <rect x=".5" y=".5" width="15" height="15" rx="3" fill="none" stroke="#A8AAB7"/>
    <text x="26" y="13">Always fit</text>
    <text class="caption" x="0" y="49">Unchecked</text>
  </g>
  <g transform="translate(852 575)">
    <rect x=".5" y=".5" width="185" height="33" rx="6.5" fill="#292B31" stroke="#3B3D46"/>
    <text x="12" y="22">16:9</text>
    <use href="#chevron" transform="translate(156 9) scale(.6667)" color="#A8AAB7"/>
    <text class="caption" x="0" y="58">Explicit selection</text>
  </g>
  <path class="line" d="M32 657h1056"/>

  <text class="section" x="32" y="692">Text and geometry</text>
  <g transform="translate(32 711)">
    <text class="sub" x="0" y="0">Combo name</text>
    <rect x="-3" y="8" width="238" height="40" rx="10" fill="none" stroke="#B8A8FF" stroke-width="2"/>
    <rect x=".5" y="11.5" width="231" height="33" rx="6.5" fill="#292B31" stroke="#3B3D46"/>
    <text x="12" y="33">Music and light</text>
    <path d="M113 20v16" stroke="#B8A8FF" stroke-width="1"/>
    <text class="caption" x="0" y="73">Segoe UI · 13 sp / 19 sp</text>
  </g>
  <g transform="translate(320 711)">
    <text class="sub" x="0" y="0">Name</text>
    <rect x=".5" y="11.5" width="231" height="33" rx="6.5" fill="#292B31" stroke="#FF9CA5"/>
    <text x="12" y="33">Untitled</text>
    <text class="danger" x="0" y="70" style="font-size:12px">Error message linked to the field</text>
  </g>
  <text class="sub" x="610" y="724">Spacing</text><text x="610" y="749">4 / 8 / 12 / 16 / 24 / 32 dp</text>
  <text class="sub" x="874" y="724">Controls / icons</text><text x="874" y="749">34 dp / 16 dp</text>
  <text class="caption" x="610" y="783">34 dp mouse target · 44 dp touch target · no overlapping hit regions</text>
  <text class="caption" x="32" y="828">DESIGN_SYSTEM.md is authoritative · Original runtime icons: Kotlin ImageVector · No external resources</text>
</svg>
