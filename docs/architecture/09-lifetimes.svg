<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1380" viewBox="0 0 1920 1380" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">09 / Кто владеет состоянием</title><desc id="svg-desc">Архитектура PhotoCombo по исходникам 7351a27b9daa140471cae8295a4aca88441ca572. Цвет — роль, штриховой контур — интерфейс, пунктирная стрелка с треугольником — реализация. Анимация линий обозначает направление данных, а не измеренную активность.</desc>
<style>
text{font-family:"Segoe UI",Arial,sans-serif;fill:#eef3fb}
.title{font-size:44px;font-weight:650;letter-spacing:-1px}
.subtitle{font-size:22px;fill:#a4b4cc}
.label{font-size:16px;letter-spacing:2px;font-weight:650}
.body{font-size:21px}.small{font-size:18px;fill:#a4b4cc}
.mono{font-family:Consolas,"Courier New",monospace;font-size:18px}
.edge{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.flow{stroke-dasharray:10 7;animation:flow 16s linear infinite}
.card:hover .card-bg{stroke:#eff7ff;filter:brightness(1.08)}
a:focus .card-bg{stroke:#fff;stroke-width:3}
@keyframes flow{to{stroke-dashoffset:-204}}
@media(prefers-reduced-motion:reduce){.flow{animation:none}}
@media print{.flow{animation:none}}
</style><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#111e33"/><stop offset="1" stop-color="#091323"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#29405b" opacity=".45"/></pattern><marker id="arrow-app" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#c2a7ff" stroke-width="2"/></marker><marker id="inherit-app" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#c2a7ff" stroke-width="1.8"/></marker><marker id="arrow-feature" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#82b7ff" stroke-width="2"/></marker><marker id="inherit-feature" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#82b7ff" stroke-width="1.8"/></marker><marker id="arrow-domain" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#57ddc4" stroke-width="2"/></marker><marker id="inherit-domain" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#57ddc4" stroke-width="1.8"/></marker><marker id="arrow-data" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#f0c175" stroke-width="2"/></marker><marker id="inherit-data" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#f0c175" stroke-width="1.8"/></marker><marker id="arrow-core" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b4d882" stroke-width="2"/></marker><marker id="inherit-core" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#b4d882" stroke-width="1.8"/></marker><marker id="arrow-ui" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ec9fc9" stroke-width="2"/></marker><marker id="inherit-ui" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ec9fc9" stroke-width="1.8"/></marker><marker id="arrow-test" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a7b8ce" stroke-width="2"/></marker><marker id="inherit-test" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a7b8ce" stroke-width="1.8"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ffaaa0" stroke-width="2"/></marker><marker id="inherit-risk" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ffaaa0" stroke-width="1.8"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#eef3fb" stroke-width="2"/></marker><marker id="inherit-ink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#eef3fb" stroke-width="1.8"/></marker><marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a4b4cc" stroke-width="2"/></marker><marker id="inherit-muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a4b4cc" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="1920" height="1380" rx="0" fill="#0b1526" /><rect width="1920" height="1380" fill="url(#paper)"/><rect width="1920" height="1380" fill="url(#grid)"/><rect x="64" y="60" width="6" height="94" rx="3" fill="#c2a7ff" /><text x="90" y="78" class="label" style="fill:#c2a7ff;">PHOTOCOMBO / ARCHITECTURE ATLAS</text><text x="88" y="132" class="title" style="">09 / Кто владеет состоянием</text><text x="90" y="173" class="subtitle" style="">Фактические точки создания и очистки. «Должен жить» и «код явно освобождает» показаны раздельно.</text><path d="M64 207 L1856 207" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><path d="M64 1314 L1856 1314" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><text x="64" y="1349" class="small" style="">2026-11-14  •  source 7351a27b9daa  •  commonMain + desktopMain</text><a href="00-guide.svg"><text x="1530" y="1349" class="small">← Навигация по атласу</text></a><text x="80" y="258" class="label" style="fill:#a4b4cc;">ОБЛАСТЬ</text><text x="450" y="258" class="label" style="fill:#a4b4cc;">СОДЕРЖИМОЕ</text><text x="970" y="258" class="label" style="fill:#a4b4cc;">СОЗДАНИЕ</text><text x="1390" y="258" class="label" style="fill:#a4b4cc;">ЗАВЕРШЕНИЕ / ГРАНИЦА</text><rect x="64" y="282" width="1792" height="67" rx="10" fill="#122239" /><rect x="64" y="294" width="4" height="43" rx="2" fill="#c2a7ff" /><text x="80" y="309" class="small" style="fill:#c2a7ff;">Koin container</text><text x="450" y="309" class="small" style="">single-сервисы, AppDb, LRU</text><text x="970" y="309" class="small" style="">startKoin(main)</text><text x="1390" y="309" class="small" style="">AppDb.onClose → close; stopKoin в main</text><text x="1390" y="333" class="small" style="">нет.</text><rect x="64" y="359" width="1792" height="67" rx="10" fill="#122239" /><rect x="64" y="371" width="4" height="43" rx="2" fill="#c2a7ff" /><text x="80" y="386" class="small" style="fill:#c2a7ff;">AppNav composition</text><text x="450" y="386" class="small" style="">rootOwner, backStack</text><text x="970" y="386" class="small" style="">remember в AppNav</text><text x="1390" y="386" class="small" style="">rootOwner: нет DisposableEffect с clear().</text><rect x="64" y="436" width="1792" height="67" rx="10" fill="#122239" /><rect x="64" y="448" width="4" height="43" rx="2" fill="#82b7ff" /><text x="80" y="463" class="small" style="fill:#82b7ff;">Корневые вкладки</text><text x="450" y="463" class="small" style="">LibraryVM / ComboListVM</text><text x="970" y="463" class="small" style="">koinViewModel + rootOwner</text><text x="1390" y="463" class="small" style="">Живут при переключениях, пока удержан</text><text x="1390" y="487" class="small" style="">owner.</text><rect x="64" y="513" width="1792" height="67" rx="10" fill="#122239" /><rect x="64" y="525" width="4" height="43" rx="2" fill="#82b7ff" /><text x="80" y="540" class="small" style="fill:#82b7ff;">EntryScope composition</text><text x="450" y="540" class="small" style="">ViewerVM / BuilderVM</text><text x="970" y="540" class="small" style="">rememberEntry…Owner</text><text x="1390" y="540" class="small" style="">onDispose → ViewModelStore.clear().</text><rect x="64" y="590" width="1792" height="67" rx="10" fill="#122239" /><rect x="64" y="602" width="4" height="43" rx="2" fill="#57ddc4" /><text x="80" y="617" class="small" style="fill:#57ddc4;">ViewModel scope</text><text x="450" y="617" class="small" style="">jobs, PhotoAssets, draft/history</text><text x="970" y="617" class="small" style="">init / constructor VM</text><text x="1390" y="617" class="small" style="">Отмена scope при clear; ссылки живут с VM.</text><rect x="64" y="667" width="1792" height="67" rx="10" fill="#122239" /><rect x="64" y="679" width="4" height="43" rx="2" fill="#57ddc4" /><text x="80" y="694" class="small" style="fill:#57ddc4;">LRU decodeScope</text><text x="450" y="694" class="small" style="">Deferred + общий кэш</text><text x="970" y="694" class="small" style="">SupervisorJob + Default</text><text x="1390" y="694" class="small" style="">Не дочерний к VM; явного close/cancel нет.</text><rect x="64" y="744" width="1792" height="67" rx="10" fill="#122239" /><rect x="64" y="756" width="4" height="43" rx="2" fill="#ec9fc9" /><text x="80" y="771" class="small" style="fill:#ec9fc9;">Compose instance</text><text x="450" y="771" class="small" style="">dialogs, pager, Thumb bitmap</text><text x="970" y="771" class="small" style="">remember / LaunchedEffect</text><text x="1390" y="771" class="small" style="">Эффекты привязаны к композиции / ключам.</text><rect x="64" y="821" width="1792" height="67" rx="10" fill="#122239" /><rect x="64" y="833" width="4" height="43" rx="2" fill="#b4d882" /><text x="80" y="848" class="small" style="fill:#b4d882;">Один жест</text><text x="450" y="848" class="small" style="">pending ComboSnap / SnapSession</text><text x="970" y="848" class="small" style="">START / ItemPressed</text><text x="1390" y="848" class="small" style="">END: checkpoint; CANCEL: restore + clear.</text><rect x="64" y="898" width="1792" height="67" rx="10" fill="#122239" /><rect x="64" y="910" width="4" height="43" rx="2" fill="#f0c175" /><text x="80" y="925" class="small" style="fill:#f0c175;">Одна операция Save/Export</text><text x="450" y="925" class="small" style="">снимок / Bitmap / временный файл</text><text x="970" y="925" class="small" style="">save() / export(id)</text><text x="1390" y="925" class="small" style="">Снимок локальный; временные файлы в</text><text x="1390" y="949" class="small" style="">finally.</text><rect x="64" y="975" width="1792" height="67" rx="10" fill="#122239" /><rect x="64" y="987" width="4" height="43" rx="2" fill="#f0c175" /><text x="80" y="1002" class="small" style="fill:#f0c175;">Перезапуск приложения</text><text x="450" y="1002" class="small" style="">Room + photos + thumbs + JSON</text><text x="970" y="1002" class="small" style="">файлы в AppDirs</text><text x="1390" y="1002" class="small" style="">Долговечные данные; Undo / backStack не</text><text x="1390" y="1026" class="small" style="">пишутся.</text><g class="note"><rect x="64" y="1090" width="872" height="184" rx="14" fill="#142238" stroke="#c2a7ff" class="note-bg" stroke-opacity=".35"/><text x="84" y="1123" class="body" style="fill:#c2a7ff;">Границы доступа в Kotlin-коде</text><text x="84" y="1155" class="small" style="">public — по умолчанию; internal — модуль, включая соседние пакеты.</text><text x="84" y="1181" class="small" style="">private: член виден внутри класса; top-level — внутри файла.</text><text x="84" y="1207" class="small" style="">DraftEditor/History/Snap internal. ItemDraft публичен и изменяем.</text><text x="84" y="1233" class="small" style="">FrameSnap public, constructor private; FrameSnapState ctor internal.</text></g><g class="note"><rect x="984" y="1090" width="872" height="184" rx="14" fill="#142238" stroke="#ffaaa0" class="note-bg" stroke-opacity=".35"/><text x="1004" y="1123" class="body" style="fill:#ffaaa0;">Риски по чтению кода: проверить при расширении</text><text x="1004" y="1155" class="small" style="">Кэш VM удерживает bitmap после LRU eviction; Builder/List без pruning.</text><text x="1004" y="1181" class="small" style="">Viewer launch может завершиться после смены окна index ± 1.</text><text x="1004" y="1207" class="small" style="">PhotoAssets.runCatching / PhotoImporter.catch(Exception) ловят отмену.</text><text x="1004" y="1233" class="small" style="">Это список проверяемых гипотез; runtime-профилирование не проводилось.</text></g></svg>