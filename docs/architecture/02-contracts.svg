omain/GallerySettingsRepository.kt</title><rect x="700" y="585" width="580" height="96" rx="14" fill="#122239" stroke="#57ddc4" /><text x="722" y="619" class="body" style="fill:#57ddc4;font-size:21px;">GallerySettingsRepositoryImpl</text><text x="722" y="655" class="small" style="">load / saveScale • Mutex + memory</text></a><a href="../../data/src/commonMain/kotlin/com/combo/data/GallerySettingsStorage.kt" target="_blank"><g class="card"><title>GallerySettingsStorage — INTERFACE | data/src/commonMain/kotlin/com/combo/data/GallerySettingsStorage.kt</title><rect x="64" y="700" width="555" height="96" rx="18" fill="#122239" stroke="#f0c175" class="card-bg" stroke-opacity=".65" stroke-dasharray="7 5"/><rect x="64" y="719" width="4" height="58" rx="2" fill="#f0c175" /><text x="86" y="732" class="label" style="fill:#f0c175;">INTERFACE</text><text x="86" y="769" class="body" style="font-size:24px;">GallerySettingsStorage</text><text x="590" y="732" class="small" style="fill:#f0c175;">↗</text></g></a><path d="M687 749 L624 749" class="edge" stroke="#f0c175" stroke-dasharray="7 6" marker-end="url(#inherit-data)"/><a href="../../data/src/commonMain/kotlin/com/combo/data/GallerySettingsStorage.kt" target="_blank"><title>data/src/commonMain/kotlin/com/combo/data/GallerySettingsStorage.kt</title><rect x="700" y="700" width="580" height="96" rx="14" fill="#122239" stroke="#f0c175" /><text x="722" y="734" class="body" style="fill:#f0c175;font-size:21px;">FileGallerySettingsStorage</text><text x="722" y="770" class="small" style="">read / write • JSON + временный файл</text></a><a href="../../core/src/commonMain/kotlin/com/combo/core/image/ImageCodec.kt" target="_blank"><g class="card"><title>ImageCodec — INTERFACE | core/src/commonMain/kotlin/com/combo/core/image/ImageCodec.kt</title><rect x="64" y="815" width="555" height="96" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65" stroke-dasharray="7 5"/><rect x="64" y="834" width="4" height="58" rx="2" fill="#b4d882" /><text x="86" y="847" class="label" style="fill:#b4d882;">INTERFACE</text><text x="86" y="884" class="body" style="font-size:24px;">ImageCodec</text><text x="590" y="847" class="small" style="fill:#b4d882;">↗</text></g></a><path d="M687 864 L624 864" class="edge" stroke="#b4d882" stroke-dasharray="7 6" marker-end="url(#inherit-core)"/><a href="../../core/src/desktopMain/kotlin/com/combo/core/image/SkiaImageCodec.kt" target="_blank"><title>core/src/desktopMain/kotlin/com/combo/core/image/SkiaImageCodec.kt</title><rect x="700" y="815" width="580" height="96" rx="14" fill="#122239" stroke="#b4d882" /><text x="722" y="849" class="body" style="fill:#b4d882;font-size:21px;">SkiaImageCodec</text><text x="722" y="885" class="small" style="">readBounds / readOrientation / decode / encode</text></a><a href="../../core/src/commonMain/kotlin/com/combo/core/image/ImagePicker.kt" target="_blank"><g class="card"><title>ImagePicker / ImageSource — INTERFACE | core/src/commonMain/kotlin/com/combo/core/image/ImagePicker.kt</title><rect x="64" y="930" width="555" height="96" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65" stroke-dasharray="7 5"/><rect x="64" y="949" width="4" height="58" rx="2" fill="#b4d882" /><text x="86" y="962" class="label" style="fill:#b4d882;">INTERFACE</text><text x="86" y="999" class="body" style="font-size:24px;">ImagePicker / ImageSource</text><text x="590" y="962" class="small" style="fill:#b4d882;">↗</text></g></a><path d="M687 979 L624 979" class="edge" stroke="#b4d882" stroke-dasharray="7 6" marker-end="url(#inherit-core)"/><a href="../../core/src/desktopMain/kotlin/com/combo/core/image/DesktopImagePicker.kt" target="_blank"><title>core/src/desktopMain/kotlin/com/combo/core/image/DesktopImagePicker.kt</title><rect x="700" y="930" width="580" height="96" rx="14" fill="#122239" stroke="#b4d882" /><text x="722" y="964" class="body" style="fill:#b4d882;font-size:21px;">DesktopImagePicker / FileImageSource</text><text x="722" y="1000" class="small" style="">pickImages / openSource • native file dialog</text></a><a href="../../core/src/commonMain/kotlin/com/combo/core/image/PngOutput.kt" target="_blank"><g class="card"><title>PngOutput — INTERFACE | core/src/commonMain/kotlin/com/combo/core/image/PngOutput.kt</title><rect x="64" y="1045" width="555" height="96" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65" stroke-dasharray="7 5"/><rect x="64" y="1064" width="4" height="58" rx="2" fill="#b4d882" /><text x="86" y="1077" class="label" style="fill:#b4d882;">INTERFACE</text><text x="86" y="1114" class="body" style="font-size:24px;">PngOutput</text><text x="590" y="1077" class="small" style="fill:#b4d882;">↗</text></g></a><path d="M687 1094 L624 1094" class="edge" stroke="#b4d882" stroke-dasharray="7 6" marker-end="url(#inherit-core)"/><a href="../../core/src/desktopMain/kotlin/com/combo/core/image/DesktopPngOutput.kt" target="_blank"><title>core/src/desktopMain/kotlin/com/combo/core/image/DesktopPngOutput.kt</title><rect x="700" y="1045" width="580" height="96" rx="14" fill="#122239" stroke="#b4d882" /><text x="722" y="1079" class="body" style="fill:#b4d882;font-size:21px;">DesktopPngOutput</text><text x="722" y="1115" class="small" style="">chooseDestination / write • PNG на диск</text></a><g class="note"><rect x="1320" y="240" width="536" height="191" rx="14" fill="#142238" stroke="#57ddc4" class="note-bg" stroke-opacity=".35"/><text x="1340" y="273" class="body" style="fill:#57ddc4;">Koin: appModule</text><text x="1340" y="305" class="small" style="">single: PhotoStorage, PhotoImporter,</text><text x="1340" y="331" class="small" style="">PhotoRepository, ComboRepository,</text><text x="1340" y="357" class="small" style="">GallerySettingsStorage / Repository,</text><text x="1340" y="383" class="small" style="">ComboPngExporter.</text></g><g class="note"><rect x="1320" y="451" width="536" height="217" rx="14" fill="#142238" stroke="#b4d882" class="note-bg" stroke-opacity=".35"/><text x="1340" y="484" class="body" style="fill:#b4d882;">Koin: desktopModule()</text><text x="1340" y="516" class="small" style="">single: FileSystem.SYSTEM, AppDirs,</text><text x="1340" y="542" class="small" style="">Logger, ImageCodec, ImagePicker,</text><text x="1340" y="568" class="small" style="">PngOutput, CoroutineDispatcher,</text><text x="1340" y="594" class="small" style="">WallClock, IdGenerator, AppDb,</text><text x="1340" y="620" class="small" style="">PhotoDao, ComboDao, BitmapSource.</text></g><g class="note"><rect x="1320" y="688" width="536" height="217" rx="14" fill="#142238" stroke="#82b7ff" class="note-bg" stroke-opacity=".35"/><text x="1340" y="721" class="body" style="fill:#82b7ff;">Koin: viewModelModule</text><text x="1340" y="753" class="small" style="">Четыре viewModel-фабрики.</text><text x="1340" y="779" class="small" style="">Экземпляр кэшируется во владельце</text><text x="1340" y="805" class="small" style="">ViewModelStore, а не как single.</text><text x="1340" y="831" class="small" style="">Builder получает EntryArgs(handle).</text><text x="1340" y="857" class="small" style="">PhotoAssets создаётся вручную в VM.</text></g><g class="note"><rect x="1320" y="925" width="536" height="217" rx="14" fill="#142238" stroke="#b4d882" class="note-bg" stroke-opacity=".35"/><text x="1340" y="958" class="body" style="fill:#b4d882;">Другие реализации</text><text x="1340" y="990" class="small" style="">AppDirs ← DesktopAppDirs</text><text x="1340" y="1016" class="small" style="">Logger ← DesktopLogger</text><text x="1340" y="1042" class="small" style="">WallClock / IdGenerator ← SAM-лямбды</text><text x="1340" y="1068" class="small" style="">BackgroundStrategy ←</text><text x="1340" y="1094" class="small" style="">AverageAreaOklabStrategy (object).</text></g><g class="note"><rect x="64" y="1180" width="1792" height="106" rx="14" fill="#142238" stroke="#f0c175" class="note-bg" stroke-opacity=".35"/><text x="84" y="1213" class="body" style="fill:#f0c175;">Генерируемые и локальные объекты</text><text x="84" y="1245" class="small" style="">Room генерирует реализации PhotoDao / ComboDao / AppDb и actual AppDbConstructor. Это не ручные классы репозитория.</text><text x="84" y="1271" class="small" style="">BackgroundResolver.Default — companion val; стратегия — Kotlin object. FileImageSource — на выбранный файл, не Koin single.</text></g></svg>