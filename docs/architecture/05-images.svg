<title id="svg-title">05 / Три маршрута изображений</title><desc id="svg-desc">Архитектура PhotoCombo по исходникам 7351a27b9daa140471cae8295a4aca88441ca572. Цвет — роль, штриховой контур — интерфейс, пунктирная стрелка с треугольником — реализация. Анимация линий обозначает направление данных, а не измеренную активность.</desc>
