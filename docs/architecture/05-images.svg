</style><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#111e33"/><stop offset="1" stop-color="#091323"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#29405b" opacity=".45"/></pattern><marker id="arrow-app" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#c2a7ff" stroke-width="2"/></marker><marker id="inherit-app" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#c2a7ff" stroke-width="1.8"/></marker><marker id="arrow-feature" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#82b7ff" stroke-width="2"/></marker><marker id="inherit-feature" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#82b7ff" stroke-width="1.8"/></marker><marker id="arrow-domain" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#57ddc4" stroke-width="2"/></marker><marker id="inherit-domain" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#57ddc4" stroke-width="1.8"/></marker><marker id="arrow-data" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#f0c175" stroke-width="2"/></marker><marker id="inherit-data" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#f0c175" stroke-width="1.8"/></marker><marker id="arrow-core" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b4d882" stroke-width="2"/></marker><marker id="inherit-core" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#b4d882" stroke-width="1.8"/></marker><marker id="arrow-ui" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ec9fc9" stroke-width="2"/></marker><marker id="inherit-ui" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ec9fc9" stroke-width="1.8"/></marker><marker id="arrow-test" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a7b8ce" stroke-width="2"/></marker><marker id="inherit-test" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a7b8ce" stroke-width="1.8"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ffaaa0" stroke-width="2"/></marker><marker id="inherit-risk" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ffaaa0" stroke-width="1.8"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#eef3fb" stroke-width="2"/></marker><marker id="inherit-ink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#eef3fb" stroke-width="1.8"/></marker><marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a4b4cc" stroke-width="2"/></marker><marker id="inherit-muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a4b4cc" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="1920" height="1380" rx="0" fill="#0b1526" /><rect width="1920" height="1380" fill="url(#paper)"/><rect width="1920" height="1380" fill="url(#grid)"/><rect x="64" y="60" width="6" height="94" rx="3" fill="#57ddc4" /><text x="90" y="78" class="label" style="fill:#57ddc4;">PHOTOCOMBO / ARCHITECTURE ATLAS</text><text x="88" y="132" class="title" style="">05 / Три маршрута изображений</text><text x="90" y="173" class="subtitle" style="">Disk thumbnail, VM-local PhotoAssets и общий LruBitmapSource имеют разные ключи, владельцев и ограничения.</text><path d="M64 207 L1856 207" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><path d="M64 1314 L1856 1314" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><text x="64" y="1349" class="small" style="">2026-11-14  •  source 7351a27b9daa  •  commonMain + desktopMain</text><a href="00-guide.svg"><text x="1530" y="1349" class="small">← Навигация по атласу</text></a><a href="../../ui-common/src/commonMain/kotlin/com/combo/ui/common/ThumbImage.kt" target="_blank"><g class="card"><title>PhotoGrid → ThumbImage — COMPOSITION • remember(photoId) | ui-common/src/commonMain/kotlin/com/combo/ui/common/ThumbImage.kt</title><rect x="64" y="240" width="540" height="242" rx="18" fill="#122239" stroke="#ec9fc9" class="card-bg" stroke-opacity=".65"/><rect x="64" y="259" width="4" height="204" rx="2" fill="#ec9fc9" /><text x="86" y="272" class="label" style="fill:#ec9fc9;">COMPOSITION • remember(photoId)</text><text x="86" y="309" class="body" style="font-size:24px;">PhotoGrid → ThumbImage</text><text x="86" y="343" class="body" style="">Library и Builder PickPhotosDialog.</text><text x="86" y="372" class="body" style="">repo.thumbPath(id) → thumbs/&lt;id&gt;.jpg</text><text x="86" y="401" class="body" style="">LaunchedEffect → codec.decode() на IO.</text><text x="86" y="430" class="body" style="">Bitmap хранится в remember ячейки.</text><text x="86" y="459" class="body" style="">Этот маршрут обходит BitmapSource.</text><text x="575" y="272" class="small" style="fill:#ec9fc9;">↗</text></g></a><a href="../../domain/src/commonMain/kotlin/com/combo/domain/PhotoAssets.kt" target="_blank"><g class="card"><title>PhotoAssets — PUBLIC CLASS • ОТДЕЛЬНО В КАЖДОЙ VM | domain/src/commonMain/kotlin/com/combo/domain/PhotoAssets.kt</title><rect x="690" y="240" width="540" height="242" rx="18" fill="#122239" stroke="#57ddc4" class="card-bg" stroke-opacity=".65"/><rect x="690" y="259" width="4" height="204" rx="2" fill="#57ddc4" /><text x="712" y="272" class="label" style="fill:#57ddc4;">PUBLIC CLASS • ОТДЕЛЬНО В КАЖДОЙ VM</text><text x="712" y="309" class="body" style="font-size:24px;">PhotoAssets</text><text x="712" y="343" class="body" style="">Viewer / ComboList / Builder → new.</text><text x="712" y="372" class="body" style="">ensureMeta(ids): PhotoRepository.get</text><text x="712" y="401" class="body" style="">ensureBitmap(id, requiredPx): пропуск</text><text x="712" y="430" class="body" style="">при достаточном loadedReqPx[id].</text><text x="712" y="459" class="body" style="">StateFlow: photos и bitmaps.</text><text x="1201" y="272" class="small" style="fill:#57ddc4;">↗</text></g></a><a href="../../feature/builder/src/commonMain/kotlin/com/combo/feature/builder/ComboBuilderViewModel.kt" target="_blank"><g class="card"><title>Политики загрузки экранов — VIEWMODEL • НЕ В КЭШЕ | feature/builder/src/commonMain/kotlin/com/combo/feature/builder/ComboBuilderViewModel.kt</title><rect x="1316" y="240" width="540" height="242" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="1316" y="259" width="4" height="204" rx="2" fill="#82b7ff" /><text x="1338" y="272" class="label" style="fill:#82b7ff;">VIEWMODEL • НЕ В КЭШЕ</text><text x="1338" y="309" class="body" style="font-size:24px;">Политики загрузки экранов</text><text x="1338" y="343" class="body" style="">ComboList: 800 px на фото превью.</text><text x="1338" y="372" class="body" style="">Viewer: 2048 px, окно index ± 1.</text><text x="1338" y="401" class="body" style="">Builder: maxBorder × viewport.zoom × 2,</text><text x="1338" y="430" class="body" style="">clamp 128…4096; debounce 300 ms.</text><text x="1338" y="459" class="body" style="">Export: размер по эффективному scale.</text><text x="1827" y="272" class="small" style="fill:#82b7ff;">↗</text></g></a><path d="M1316 370 L1236 370" class="edge" stroke="#57ddc4" marker-end="url(#arrow-domain)"/><path d="M960 482 L960 547" class="edge" stroke="#57ddc4" marker-end="url(#arrow-domain)"/><rect x="867.4" y="506" width="185.2" height="29" rx="6" fill="#0c1729" /><text x="878.4" y="526" class="small" style="fill:#57ddc4;">BitmapSource.get</text><a href="../../domain/src/commonMain/kotlin/com/combo/domain/image/LruBitmapSource.kt" target="_blank"><g class="card"><title>LruBitmapSource : BitmapSource — KOIN SINGLE • PROCESS CONTAINER | domain/src/commonMain/kotlin/com/combo/domain/image/LruBitmapSource.kt</title><rect x="690" y="547" width="1166" height="254" rx="18" fill="#122239" stroke="#57ddc4" class="card-bg" stroke-opacity=".65"/><rect x="690" y="566" width="4" height="216" rx="2" fill="#57ddc4" /><text x="712" y="579" class="label" style="fill:#57ddc4;">KOIN SINGLE • PROCESS CONTAINER</text><text x="712" y="616" class="body" style="font-size:24px;">LruBitmapSource : BitmapSource</text><text x="712" y="650" class="body" style="">PhotoDao.get → sampleSizeFor → key = photoId:sample → Mutex → cache / inFlight.</text><text x="712" y="679" class="body" style="">Один Deferred на одинаковый ключ; разные ключи декодируются независимо.</text><text x="712" y="708" class="body" style="">LinkedHashMap с переупорядочиванием при доступе; учёт width × height × 4 / 1024.</text><text x="712" y="737" class="body" style="">maxCacheKb = max(4, JVM maxMemory / 1024 / 4). Это лимит только записей LRU.</text><text x="712" y="766" class="body" style="">decodeScope = SupervisorJob + Dispatchers.Default; не дочерний scope ViewModel.</text><text x="1827" y="579" class="small" style="fill:#57ddc4;">↗</text></g></a><a href="../../domain/src/commonMain/kotlin/com/combo/domain/PhotoAssets.kt" target="_blank"><g class="card"><title>evictExcept(keep) — PUBLIC METHOD • ВЫЗЫВАЕТ VIEWER | domain/src/commonMain/kotlin/com/combo/domain/PhotoAssets.kt</title><rect x="64" y="547" width="540" height="254" rx="18" fill="#122239" stroke="#ffaaa0" class="card-bg" stroke-opacity=".65"/><rect x="64" y="566" width="4" height="216" rx="2" fill="#ffaaa0" /><text x="86" y="579" class="label" style="fill:#ffaaa0;">PUBLIC METHOD • ВЫЗЫВАЕТ VIEWER</text><text x="86" y="616" class="body" style="font-size:24px;">evictExcept(keep)</text><text x="86" y="650" class="body" style="">Удаляет bitmaps и loadedReqPx вне keep.</text><text x="86" y="679" class="body" style="">Карта метаданных photos не очищается.</text><text x="86" y="708" class="body" style="">ComboList и Builder eviction не вызывают.</text><text x="86" y="737" class="body" style="">Ссылки VM переживают вытеснение из LRU.</text><text x="86" y="766" class="body" style="">Общий лимит памяти не равен лимиту LRU.</text><text x="575" y="579" class="small" style="fill:#ffaaa0;">↗</text></g></a><path d="M1268 801 L1268 862" class="edge" stroke="#b4d882" marker-end="url(#arrow-core)"/><a href="../../core/src/desktopMain/kotlin/com/combo/core/image/SkiaImageCodec.kt" target="_blank"><g class="card"><title>PhotoStorage → ImageCodec → SkiaImageCodec — DISK → DECODE → ImageBitmap | core/src/desktopMain/kotlin/com/combo/core/image/SkiaImageCodec.kt</title><rect x="690" y="862" width="1166" height="217" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65"/><rect x="690" y="881" width="4" height="179" rx="2" fill="#b4d882" /><text x="712" y="894" class="label" style="fill:#b4d882;">DISK → DECODE → ImageBitmap</text><text x="712" y="931" class="body" style="font-size:21px;">PhotoStorage → ImageCodec → SkiaImageCodec</text><text x="712" y="965" class="body" style="">photos/&lt;fileName&gt;: уже нормализованные при импорте пиксели; EXIF повторно не применяется.</text><text x="712" y="994" class="body" style="">sample: степень двойки; уменьшенный decode или полный decode + scaleDown fallback.</text><text x="712" y="1023" class="body" style="">Файл прочитан в bytes. Временные и удерживаемые bitmap могут выйти за бюджет LRU.</text><text x="712" y="1052" class="body" style="">LruBitmapSource возвращает ImageBitmap; PhotoAssets публикует его в StateFlow.</text><text x="1827" y="894" class="small" style="fill:#b4d882;">↗</text></g></a><g class="note"><rect x="64" y="862" width="540" height="217" rx="14" fill="#142238" stroke="#ffaaa0" class="note-bg" stroke-opacity=".35"/><text x="84" y="895" class="body" style="fill:#ffaaa0;">Осторожно с обещаниями lifecycle</text><text x="84" y="927" class="small" style="">Viewer создаёт новые launch при листании.</text><text x="84" y="953" class="small" style="">Старый запрос может вернуть уже вытесненный id.</text><text x="84" y="979" class="small" style="">PhotoAssets.runCatching ловит и отмену.</text><text x="84" y="1005" class="small" style="">Это риски по коду, не измеренные сбои.</text></g><g class="note"><rect x="64" y="1130" width="1792" height="130" rx="14" fill="#142238" stroke="#f0c175" class="note-bg" stroke-opacity=".35"/><text x="84" y="1163" class="body" style="fill:#f0c175;">Владение ссылкой ≠ владение выделенной памятью</text><text x="84" y="1195" class="small" style="">Один ImageBitmap может одновременно удерживаться LRU, PhotoAssets и UI. Удаление одной ссылки не доказывает освобождение изображения.</text><text x="84" y="1221" class="small" style="">У LruBitmapSource нет close()/явной отмены decodeScope. Не переносите предположение «экран закрыт → декод прекращён» в новый код.</text></g></svg>