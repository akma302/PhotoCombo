" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b4d882" stroke-width="2"/></marker><marker id="inherit-core" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#b4d882" stroke-width="1.8"/></marker><marker id="arrow-ui" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ec9fc9" stroke-width="2"/></marker><marker id="inherit-ui" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ec9fc9" stroke-width="1.8"/></marker><marker id="arrow-test" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a7b8ce" stroke-width="2"/></marker><marker id="inherit-test" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a7b8ce" stroke-width="1.8"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ffaaa0" stroke-width="2"/></marker><marker id="inherit-risk" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ffaaa0" stroke-width="1.8"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#eef3fb" stroke-width="2"/></marker><marker id="inherit-ink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#eef3fb" stroke-width="1.8"/></marker><marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a4b4cc" stroke-width="2"/></marker><marker id="inherit-muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a4b4cc" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="1920" height="1380" rx="0" fill="#0b1526" /><rect width="1920" height="1380" fill="url(#paper)"/><rect width="1920" height="1380" fill="url(#grid)"/><rect x="64" y="60" width="6" height="94" rx="3" fill="#c2a7ff" /><text x="90" y="78" class="label" style="fill:#c2a7ff;">PHOTOCOMBO / ARCHITECTURE ATLAS</text><text x="88" y="132" class="title" style="">Архитектура, которую можно изучать</text><text x="90" y="173" class="subtitle" style="">От Gradle-графа до одного пикселя: роли, контракты, владение, данные и ограничения текущей реализации.</text><path d="M64 207 L1856 207" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><path d="M64 1314 L1856 1314" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><text x="64" y="1349" class="small" style="">2026-11-14  •  source 7351a27b9daa  •  commonMain + desktopMain</text><a href="00-guide.svg"><text x="1530" y="1349" class="small">← Навигация по атласу</text></a><text x="64" y="266" class="body" style="font-size:72px;">11</text><text x="170" y="256" class="body" style="">модулей Gradle</text><text x="170" y="288" class="small" style="">10 production + test-support</text><text x="675" y="266" class="body" style="font-size:72px;">135</text><text x="825" y="256" class="body" style="">Kotlin-файлов Main</text><text x="825" y="288" class="small" style="">включая тестовые адаптеры</text><text x="1290" y="266" class="body" style="font-size:72px;">78</text><text x="1435" y="256" class="body" style="">файлов тестов</text><text x="1435" y="288" class="small" style="">каталог, не результат запуска</text><a href="01-modules.svg"><g class="card"><title>01 / Границы модулей — ОТКРЫТЬ ГЛАВУ →</title><rect x="64" y="345" width="572" height="144" rx="18" fill="#122239" stroke="#c2a7ff" class="card-bg" stroke-opacity=".65"/><rect x="64" y="364" width="4" height="106" rx="2" fill="#c2a7ff" /><text x="86" y="377" class="label" style="fill:#c2a7ff;">ОТКРЫТЬ ГЛАВУ →</text><text x="86" y="414" class="body" style="font-size:24px;">01 / Границы модулей</text><text x="86" y="448" class="body" style="">Полный граф api / implementation</text></g></a><a href="02-contracts.svg"><g class="card"><title>02 / Контракты и DI — ОТКРЫТЬ ГЛАВУ →</title><rect x="674" y="345" width="572" height="144" rx="18" fill="#122239" stroke="#57ddc4" class="card-bg" stroke-opacity=".65"/><rect x="674" y="364" width="4" height="106" rx="2" fill="#57ddc4" /><text x="696" y="377" class="label" style="fill:#57ddc4;">ОТКРЫТЬ ГЛАВУ →</text><text x="696" y="414" class="body" style="font-size:24px;">02 / Контракты и DI</text><text x="696" y="448" class="body" style="">Кто создаёт и что подменяется</text></g></a><a href="03-navigation.svg"><g class="card"><title>03 / Экраны и навигация — ОТКРЫТЬ ГЛАВУ →</title><rect x="1284" y="345" width="572" height="144" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="1284" y="364" width="4" height="106" rx="2" fill="#82b7ff" /><text x="1306" y="377" class="label" style="fill:#82b7ff;">ОТКРЫТЬ ГЛАВУ →</text><text x="1306" y="414" class="body" style="font-size:24px;">03 / Экраны и навигация</text><text x="1306" y="448" class="body" style="">Четыре фичи, два типа владельцев</text></g></a><a href="04-builder.svg"><g class="card"><title>04 / Внутри Builder — ОТКРЫТЬ ГЛАВУ →</title><rect x="64" y="525" width="572" height="144" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="64" y="544" width="4" height="106" rx="2" fill="#82b7ff" /><text x="86" y="557" class="label" style="fill:#82b7ff;">ОТКРЫТЬ ГЛАВУ →</text><text x="86" y="594" class="body" style="font-size:24px;">04 / Внутри Builder</text><text x="86" y="628" class="body" style="">Событие → мутация → снимок → Undo</text></g></a><a href="05-images.svg"><g class="card"><title>05 / Изображения и память — ОТКРЫТЬ ГЛАВУ →</title><rect x="674" y="525" width="572" height="144" rx="18" fill="#122239" stroke="#57ddc4" class="card-bg" stroke-opacity=".65"/><rect x="674" y="544" width="4" height="106" rx="2" fill="#57ddc4" /><text x="696" y="557" class="label" style="fill:#57ddc4;">ОТКРЫТЬ ГЛАВУ →</text><text x="696" y="594" class="body" style="font-size:24px;">05 / Изображения и память</text><text x="696" y="628" class="body" style="">Три маршрута загрузки и два кэша</text></g></a><a href="06-storage.svg"><g class="card"><title>06 / Импорт и хранение — ОТКРЫТЬ ГЛАВУ →</title><rect x="1284" y="525" width="572" height="144" rx="18" fill="#122239" stroke="#f0c175" class="card-bg" stroke-opacity=".65"/><rect x="1284" y="544" width="4" height="106" rx="2" fill="#f0c175" /><text x="1306" y="557" class="label" style="fill:#f0c175;">ОТКРЫТЬ ГЛАВУ →</text><text x="1306" y="594" class="body" style="font-size:24px;">06 / Импорт и хранение</text><text x="1306" y="628" class="body" style="">Файлы, SQLite, JSON и целостность</text></g></a><a href="07-render-export.svg"><g class="card"><title>07 / Рендер и экспорт — ОТКРЫТЬ ГЛАВУ →</title><rect x="64" y="705" width="572" height="144" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65"/><rect x="64" y="724" width="4" height="106" rx="2" fill="#b4d882" /><text x="86" y="737" class="label" style="fill:#b4d882;">ОТКРЫТЬ ГЛАВУ →</text><text x="86" y="774" class="body" style="font-size:24px;">07 / Рендер и экспорт</text><text x="86" y="808" class="body" style="">Общая геометрия и сохранённый PNG</text></g></a><a href="08-reuse.svg"><g class="card"><title>08 / Повторное использование — ОТКРЫТЬ ГЛАВУ →</title><rect x="674" y="705" width="572" height="144" rx="18" fill="#122239" stroke="#ec9fc9" class="card-bg" stroke-opacity=".65"/><rect x="674" y="724" width="4" height="106" rx="2" fill="#ec9fc9" /><text x="696" y="737" class="label" style="fill:#ec9fc9;">ОТКРЫТЬ ГЛАВУ →</text><text x="696" y="774" class="body" style="font-size:24px;">08 / Повторное использование</text><text x="696" y="808" class="body" style="">UI, дизайн-система и тестовые швы</text></g></a><a href="09-lifetimes.svg"><g class="card"><title>09 / Время жизни — ОТКРЫТЬ ГЛАВУ →</title><rect x="1284" y="705" width="572" height="144" rx="18" fill="#122239" stroke="#ffaaa0" class="card-bg" stroke-opacity=".65"/><rect x="1284" y="724" width="4" height="106" rx="2" fill="#ffaaa0" /><text x="1306" y="737" class="label" style="fill:#ffaaa0;">ОТКРЫТЬ ГЛАВУ →</text><text x="1306" y="774" class="body" style="font-size:24px;">09 / Время жизни</text><text x="1306" y="808" class="body" style="">Владельцы, отмена и зоны внимания</text></g></a><text x="64" y="957" class="body" style="">Условные обозначения</text><rect x="64" y="985" width="12" height="12" rx="6" fill="#c2a7ff" /><text x="88" y="998" class="small" style="">Сборка</text><rect x="362" y="985" width="12" height="12" rx="6" fill="#82b7ff" /><text x="386" y="998" class="small" style="">Экраны</text><rect x="660" y="985" width="12" height="12" rx="6" fill="#57ddc4" /><text x="684" y="998" class="small" style="">Сервисы</text><rect x="958" y="985" width="12" height="12" rx="6" fill="#f0c175" /><text x="982" y="998" class="small" style="">Хранение</text><rect x="1256" y="985" width="12" height="12" rx="6" fill="#b4d882" /><text x="1280" y="998" class="small" style="">Геометрия</text><rect x="1554" y="985" width="12" height="12" rx="6" fill="#ec9fc9" /><text x="1578" y="998" class="small" style="">Общий UI</text><path d="M68 1045 L188 1045" class="edge" stroke="#a7b8ce" marker-end="url(#arrow-test)"/><text x="210" y="1052" class="small" style="">использует / вызывает → адресат</text><path d="M690 1045 L810 1045" class="edge" stroke="#57ddc4" stroke-dasharray="7 6" marker-end="url(#inherit-domain)"/><text x="832" y="1052" class="small" style="">реализация → контракт</text><path d="M1300 1045 L1420 1045" class="edge flow" stroke="#f0c175" marker-end="url(#arrow-data)"/><text x="1442" y="1052" class="small" style="">данные → получатель</text><g class="note"><rect x="64" y="1094" width="872" height="155" rx="14" fill="#142238" stroke="#c2a7ff" class="note-bg" stroke-opacity=".35"/><text x="84" y="1127" class="body" style="fill:#c2a7ff;">public / internal / private ≠ время жизни</text><text x="84" y="1159" class="small" style="">Модификаторы описывают доступ. SINGLE / ROOT / ENTRY / LOCAL — владельца.</text><text x="84" y="1185" class="small" style="">Пунктирный контур: interface. Цвет показывает роль, а не видимость.</text></g><g class="note"><rect x="984" y="1094" width="872" height="155" rx="14" fill="#142238" stroke="#b4d882" class="note-bg" stroke-opacity=".35"/><text x="1004" y="1127" class="body" style="fill:#b4d882;">Как читать и проверять</text><text x="1004" y="1159" class="small" style="">Начните с 01 → 03 → 04 → 07. Карточки с ↗ ведут к исходникам.</text><text x="1004" y="1185" class="small" style="">ONBOARDING.md — объяснения; SOURCE_INDEX.md — все Main-файлы и тесты.</text><text x="1004" y="1211" class="small" style="">Анимация иллюстративная. Статический кадр содержит всю информацию.</text></g></svg>