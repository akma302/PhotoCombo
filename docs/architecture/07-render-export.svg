" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b4d882" stroke-width="2"/></marker><marker id="inherit-core" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#b4d882" stroke-width="1.8"/></marker><marker id="arrow-ui" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ec9fc9" stroke-width="2"/></marker><marker id="inherit-ui" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ec9fc9" stroke-width="1.8"/></marker><marker id="arrow-test" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a7b8ce" stroke-width="2"/></marker><marker id="inherit-test" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a7b8ce" stroke-width="1.8"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ffaaa0" stroke-width="2"/></marker><marker id="inherit-risk" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ffaaa0" stroke-width="1.8"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#eef3fb" stroke-width="2"/></marker><marker id="inherit-ink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#eef3fb" stroke-width="1.8"/></marker><marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a4b4cc" stroke-width="2"/></marker><marker id="inherit-muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a4b4cc" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="1920" height="1380" rx="0" fill="#0b1526" /><rect width="1920" height="1380" fill="url(#paper)"/><rect width="1920" height="1380" fill="url(#grid)"/><rect x="64" y="60" width="6" height="94" rx="3" fill="#b4d882" /><text x="90" y="78" class="label" style="fill:#b4d882;">PHOTOCOMBO / ARCHITECTURE ATLAS</text><text x="88" y="132" class="title" style="">07 / Один рендерер, три потребителя</text><text x="90" y="173" class="subtitle" style="">Редактор работает с драфтом, список и PNG — с сохранённой конфигурацией. Общая геометрия обеспечивает согласованность.</text><path d="M64 207 L1856 207" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><path d="M64 1314 L1856 1314" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><text x="64" y="1349" class="small" style="">2026-11-14  •  source 7351a27b9daa  •  commonMain + desktopMain</text><a href="00-guide.svg"><text x="1530" y="1349" class="small">← Навигация по атласу</text></a><a href="../../feature/builder/src/commonMain/kotlin/com/combo/feature/builder/EditorCanvas.kt" target="_blank"><g class="card"><title>Builder / EditorCanvas — LIVE DRAFT | feature/builder/src/commonMain/kotlin/com/combo/feature/builder/EditorCanvas.kt</title><rect x="64" y="240" width="540" height="201" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="64" y="259" width="4" height="163" rx="2" fill="#82b7ff" /><text x="86" y="272" class="label" style="fill:#82b7ff;">LIVE DRAFT</text><text x="86" y="309" class="body" style="font-size:24px;">Builder / EditorCanvas</text><text x="86" y="343" class="body" style="">ItemDraft → draft.frameContent()</text><text x="86" y="372" class="body" style="">CanvasTransform.ofViewport()</text><text x="86" y="401" class="body" style="">Selection / Snap overlay рисуются отдельно.</text><text x="575" y="272" class="small" style="fill:#82b7ff;">↗</text></g></a><a href="../../feature/combo-list/src/commonMain/kotlin/com/combo/feature/combo_list/ComboListScreen.kt" target="_blank"><g class="card"><title>ComboList / preview — SAVED CONFIG | feature/combo-list/src/commonMain/kotlin/com/combo/feature/combo_list/ComboListScreen.kt</title><rect x="690" y="240" width="540" height="201" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="690" y="259" width="4" height="163" rx="2" fill="#82b7ff" /><text x="712" y="272" class="label" style="fill:#82b7ff;">SAVED CONFIG</text><text x="712" y="309" class="body" style="font-size:24px;">ComboList / preview</text><text x="712" y="343" class="body" style="">ComboItemEntity → data.frameContent()</text><text x="712" y="372" class="body" style="">CanvasTransform.fitInto()</text><text x="712" y="401" class="body" style="">framesFor(): сортировка по zIndex.</text><text x="1201" y="272" class="small" style="fill:#82b7ff;">↗</text></g></a><a href="../../domain/src/commonMain/kotlin/com/combo/domain/ComboPngExporter.kt" target="_blank"><g class="card"><title>ComboPngExporter — SAVED CONFIG • KOIN SINGLE | domain/src/commonMain/kotlin/com/combo/domain/ComboPngExporter.kt</title><rect x="1316" y="240" width="540" height="201" rx="18" fill="#122239" stroke="#57ddc4" class="card-bg" stroke-opacity=".65"/><rect x="1316" y="259" width="4" height="163" rx="2" fill="#57ddc4" /><text x="1338" y="272" class="label" style="fill:#57ddc4;">SAVED CONFIG • KOIN SINGLE</text><text x="1338" y="309" class="body" style="font-size:24px;">ComboPngExporter</text><text x="1338" y="343" class="body" style="">ComboRepository.get(id) → snapshot.</text><text x="1338" y="372" class="body" style="">CanvasTransform(1f, Offset.Zero).</text><text x="1338" y="401" class="body" style="">ImageBitmap(canvasWidth, canvasHeight).</text><text x="1827" y="272" class="small" style="fill:#57ddc4;">↗</text></g></a><path d="M334 441 L334 470" stroke="#b4d882" stroke-width="1.5" opacity="1"/><path d="M960 441 L960 470" stroke="#b4d882" stroke-width="1.5" opacity="1"/><path d="M1586 441 L1586 470" stroke="#b4d882" stroke-width="1.5" opacity="1"/><path d="M334 470 L1586 470" stroke="#b4d882" stroke-width="1.5" opacity="1"/><path d="M500 470 L500 495" class="edge flow" stroke="#b4d882" marker-end="url(#arrow-core)"/><path d="M1420 470 L1420 495" class="edge flow" stroke="#b4d882" marker-end="url(#arrow-core)"/><a href="../../core/src/commonMain/kotlin/com/combo/core/render/ItemFrames.kt" target="_blank"><g class="card"><title>buildItemFrame → contentArgsOf — PUBLIC FUNCTIONS • :core/render | core/src/commonMain/kotlin/com/combo/core/render/ItemFrames.kt</title><rect x="64" y="500" width="872" height="235" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65"/><rect x="64" y="519" width="4" height="197" rx="2" fill="#b4d882" /><text x="86" y="532" class="label" style="fill:#b4d882;">PUBLIC FUNCTIONS • :core/render</text><text x="86" y="569" class="body" style="font-size:24px;">buildItemFrame → contentArgsOf</text><text x="86" y="603" class="body" style="">Border + FramingMode + FrameContent → ItemFrame.</text><text x="86" y="632" class="body" style="">effectiveFraming(FREE): stored scale/pan.</text><text x="86" y="661" class="body" style="">effectiveFraming(FIT): fitScale, pan = 0.</text><text x="86" y="690" class="body" style="">drawItem: clip рамки → avgColor fill → drawImage.</text><text x="86" y="719" class="body" style="">rotation хранится, но текущий drawItem её не применяет.</text><text x="907" y="532" class="small" style="fill:#b4d882;">↗</text></g></a><a href="../../core/src/commonMain/kotlin/com/combo/core/background/Background.kt" target="_blank"><g class="card"><title>comboBackgroundOf → BackgroundResolver — PUBLIC • STRATEGY | core/src/commonMain/kotlin/com/combo/core/background/Background.kt</title><rect x="984" y="500" width="872" height="235" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65"/><rect x="984" y="519" width="4" height="197" rx="2" fill="#b4d882" /><text x="1006" y="532" class="label" style="fill:#b4d882;">PUBLIC • STRATEGY</text><text x="1006" y="569" class="body" style="font-size:21px;">comboBackgroundOf → BackgroundResolver</text><text x="1006" y="603" class="body" style="">BackgroundSpec.Solid → цвет без вычисления.</text><text x="1006" y="632" class="body" style="">Auto → AverageAreaOklabStrategy → ResolvedBackground.Solid.</text><text x="1006" y="661" class="body" style="">Вес = площадь рамки в холсте; перекрытия не вычитаются.</text><text x="1006" y="690" class="body" style="">Oklab преобразует цвета; неизвестный id → default strategy.</text><text x="1006" y="719" class="body" style="">AverageColor вычисляется при импорте, а не каждый draw.</text><text x="1827" y="532" class="small" style="fill:#b4d882;">↗</text></g></a><path d="M500 735 L500 790" class="edge flow" stroke="#b4d882" marker-end="url(#arrow-core)"/><path d="M1420 735 L1420 790" class="edge flow" stroke="#b4d882" marker-end="url(#arrow-core)"/><a href="../../core/src/commonMain/kotlin/com/combo/core/render/DrawCombo.kt" target="_blank"><g class="card"><title>DrawScope.drawCombo(transform, canvasW, canvasH, background, frames) — PUBLIC FUNCTION • SHARED RENDER PATH | core/src/commonMain/kotlin/com/combo/core/render/DrawCombo.kt</title><rect x="64" y="790" width="1792" height="158" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65"/><rect x="64" y="809" width="4" height="120" rx="2" fill="#b4d882" /><text x="86" y="822" class="label" style="fill:#b4d882;">PUBLIC FUNCTION • SHARED RENDER PATH</text><text x="86" y="859" class="body" style="font-size:21px;">DrawScope.drawCombo(transform, canvasW, canvasH, background, frames)</text><text x="86" y="893" class="body" style="">translate(origin) → scale → clipRect(canvas) → drawComboBackground → frames.forEach(drawItem).</text><text x="86" y="922" class="body" style="">Переданный порядок определяет слои. Overlay редактора не входит ни в превью, ни в экспорт.</text><text x="1827" y="822" class="small" style="fill:#b4d882;">↗</text></g></a><g class="note"><rect x="64" y="1008" width="872" height="213" rx="14" fill="#142238" stroke="#f0c175" class="note-bg" stroke-opacity=".35"/><text x="84" y="1041" class="body" style="fill:#f0c175;">Save и Export — разные действия</text><text x="84" y="1073" class="small" style="">Save: копия ComboSnap → trimmedToPhotos → Room-транзакция.</text><text x="84" y="1099" class="small" style="">Обрезка меняет размер сохранённого холста и центры его рамок.</text><text x="84" y="1125" class="small" style="">Export: читает уже сохранённый combo; не читает открытый draft.</text><text x="84" y="1151" class="small" style="">PNG имеет размер сохранённого холста, максимум 32 000 000 px.</text></g><g class="note"><rect x="984" y="1008" width="872" height="213" rx="14" fill="#142238" stroke="#57ddc4" class="note-bg" stroke-opacity=".35"/><text x="1004" y="1041" class="body" style="fill:#57ddc4;">PngOutput → DesktopPngOutput</text><text x="1004" y="1073" class="small" style="">chooseDestination: Dispatchers.Swing / native FileDialog.</text><text x="1004" y="1099" class="small" style="">Декод, render и write выполняются в IO-контексте exporter.</text><text x="1004" y="1125" class="small" style="">Временный файл рядом с целью → move; уборка в finally.</text><text x="1004" y="1151" class="small" style="">Экспорт внутрь каталога библиотеки запрещён самим адаптером.</text></g><text x="64" y="1270" class="body" style="fill:#b4d882;">Три независимых масштаба: разрешение холста • масштаб фото относительно оригинала • масштаб вида редактора.</text></svg>