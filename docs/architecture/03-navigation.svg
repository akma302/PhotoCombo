" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b4d882" stroke-width="2"/></marker><marker id="inherit-core" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#b4d882" stroke-width="1.8"/></marker><marker id="arrow-ui" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ec9fc9" stroke-width="2"/></marker><marker id="inherit-ui" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ec9fc9" stroke-width="1.8"/></marker><marker id="arrow-test" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a7b8ce" stroke-width="2"/></marker><marker id="inherit-test" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a7b8ce" stroke-width="1.8"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ffaaa0" stroke-width="2"/></marker><marker id="inherit-risk" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ffaaa0" stroke-width="1.8"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#eef3fb" stroke-width="2"/></marker><marker id="inherit-ink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#eef3fb" stroke-width="1.8"/></marker><marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a4b4cc" stroke-width="2"/></marker><marker id="inherit-muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a4b4cc" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="1920" height="1380" rx="0" fill="#0b1526" /><rect width="1920" height="1380" fill="url(#paper)"/><rect width="1920" height="1380" fill="url(#grid)"/><rect x="64" y="60" width="6" height="94" rx="3" fill="#82b7ff" /><text x="90" y="78" class="label" style="fill:#82b7ff;">PHOTOCOMBO / ARCHITECTURE ATLAS</text><text x="88" y="132" class="title" style="">03 / Навигация и четыре разных экрана</text><text x="90" y="173" class="subtitle" style="">Features не импортируют друг друга: AppNav соединяет callbacks и типизированные ScreenKey.</text><path d="M64 207 L1856 207" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><path d="M64 1314 L1856 1314" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><text x="64" y="1349" class="small" style="">2026-11-14  •  source 7351a27b9daa  •  commonMain + desktopMain</text><a href="00-guide.svg"><text x="1530" y="1349" class="small">← Навигация по атласу</text></a><a href="../../composeApp/src/commonMain/kotlin/com/combo/ui/AppNav.kt" target="_blank"><g class="card"><title>AppNav → NavDisplay + mutableStateListOf&lt;NavKey&gt; — APP • PUBLIC COMPOSABLE | composeApp/src/commonMain/kotlin/com/combo/ui/AppNav.kt</title><rect x="64" y="240" width="1792" height="159" rx="18" fill="#122239" stroke="#c2a7ff" class="card-bg" stroke-opacity=".65"/><rect x="64" y="259" width="4" height="121" rx="2" fill="#c2a7ff" /><text x="86" y="272" class="label" style="fill:#c2a7ff;">APP • PUBLIC COMPOSABLE</text><text x="86" y="309" class="body" style="font-size:21px;">AppNav → NavDisplay + mutableStateListOf&lt;NavKey&gt;</text><text x="86" y="343" class="body" style="">Library / Combos → общий rootOwner. Viewer / Builder → private EntryScope с отдельным owner.</text><text x="86" y="372" class="body" style="">Стек в remember; сериализации и восстановления после перезапуска нет. switchTab меняет один стек.</text><text x="1827" y="272" class="small" style="fill:#c2a7ff;">↗</text></g></a><path d="M270 399 L270 455" class="edge" stroke="#c2a7ff" stroke-dasharray="7 6" marker-end="url(#arrow-app)"/><a href="../../feature/library/src/commonMain/kotlin/com/combo/feature/library/LibraryViewModel.kt" target="_blank"><g class="card"><title>LibraryScreen — PUBLIC • ROOT | feature/library/src/commonMain/kotlin/com/combo/feature/library/LibraryViewModel.kt</title><rect x="64" y="455" width="412" height="353" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="64" y="474" width="4" height="315" rx="2" fill="#82b7ff" /><text x="86" y="487" class="label" style="fill:#82b7ff;">PUBLIC • ROOT</text><text x="86" y="524" class="body" style="font-size:24px;">LibraryScreen</text><text x="86" y="558" class="body" style="">LibraryViewModel</text><text x="86" y="587" class="body" style="">PhotoRepository + ImagePicker</text><text x="86" y="616" class="body" style="">GalleryScaleState(Photos)</text><text x="86" y="645" class="body" style="">StateFlow: photos, selection</text><text x="86" y="674" class="body" style="">Channel → messages</text><text x="86" y="703" class="body" style="">Выбор упорядочен; max 10 фото.</text><text x="447" y="487" class="small" style="fill:#82b7ff;">↗</text></g></a><path d="M730 399 L730 455" class="edge" stroke="#c2a7ff" stroke-dasharray="7 6" marker-end="url(#arrow-app)"/><a href="../../feature/combo-list/src/commonMain/kotlin/com/combo/feature/combo_list/ComboListViewModel.kt" target="_blank"><g class="card"><title>ComboListScreen — PUBLIC • ROOT | feature/combo-list/src/commonMain/kotlin/com/combo/feature/combo_list/ComboListViewModel.kt</title><rect x="524" y="455" width="412" height="353" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="524" y="474" width="4" height="315" rx="2" fill="#82b7ff" /><text x="546" y="487" class="label" style="fill:#82b7ff;">PUBLIC • ROOT</text><text x="546" y="524" class="body" style="font-size:24px;">ComboListScreen</text><text x="546" y="558" class="body" style="">ComboListViewModel</text><text x="546" y="587" class="body" style="">ComboRepository + PhotoRepository</text><text x="546" y="616" class="body" style="">PhotoAssets + GalleryScaleState</text><text x="546" y="645" class="body" style="">State: combos / photos / images</text><text x="546" y="674" class="body" style="">exportPng: suspend (String) →</text><text x="546" y="703" class="body" style="">String?</text><text x="546" y="732" class="body" style="">Один экспорт за раз.</text><text x="907" y="487" class="small" style="fill:#82b7ff;">↗</text></g></a><path d="M1190 399 L1190 455" class="edge" stroke="#c2a7ff" stroke-dasharray="7 6" marker-end="url(#arrow-app)"/><a href="../../feature/viewer/src/commonMain/kotlin/com/combo/feature/viewer/PhotoViewerViewModel.kt" target="_blank"><g class="card"><title>PhotoViewerScreen — PUBLIC • ENTRY | feature/viewer/src/commonMain/kotlin/com/combo/feature/viewer/PhotoViewerViewModel.kt</title><rect x="984" y="455" width="412" height="353" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="984" y="474" width="4" height="315" rx="2" fill="#82b7ff" /><text x="1006" y="487" class="label" style="fill:#82b7ff;">PUBLIC • ENTRY</text><text x="1006" y="524" class="body" style="font-size:24px;">PhotoViewerScreen</text><text x="1006" y="558" class="body" style="">PhotoViewerViewModel</text><text x="1006" y="587" class="body" style="">PhotoRepository + BitmapSource</text><text x="1006" y="616" class="body" style="">PhotoAssets: окно index ± 1</text><text x="1006" y="645" class="body" style="">State: photos / images</text><text x="1006" y="674" class="body" style="">UI: pager, scale, offset в</text><text x="1006" y="703" class="body" style="">remember</text><text x="1006" y="732" class="body" style="">Viewer photoId передаётся экрану.</text><text x="1367" y="487" class="small" style="fill:#82b7ff;">↗</text></g></a><path d="M1650 399 L1650 455" class="edge" stroke="#c2a7ff" stroke-dasharray="7 6" marker-end="url(#arrow-app)"/><a href="../../feature/builder/src/commonMain/kotlin/com/combo/feature/builder/ComboBuilderViewModel.kt" target="_blank"><g class="card"><title>ComboBuilderScreen — PUBLIC • ENTRY | feature/builder/src/commonMain/kotlin/com/combo/feature/builder/ComboBuilderViewModel.kt</title><rect x="1444" y="455" width="412" height="353" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="1444" y="474" width="4" height="315" rx="2" fill="#82b7ff" /><text x="1466" y="487" class="label" style="fill:#82b7ff;">PUBLIC • ENTRY</text><text x="1466" y="524" class="body" style="font-size:24px;">ComboBuilderScreen</text><text x="1466" y="558" class="body" style="">ComboBuilderViewModel</text><text x="1466" y="587" class="body" style="">ComboRepository + PhotoRepository</text><text x="1466" y="616" class="body" style="">PhotoAssets + DraftHistory</text><text x="1466" y="645" class="body" style="">State: BuilderUiState + bitmaps</text><text x="1466" y="674" class="body" style="">Channel: saved / messages</text><text x="1466" y="703" class="body" style="">Аргументы: comboId или photos.</text><text x="1827" y="487" class="small" style="fill:#82b7ff;">↗</text></g></a><text x="64" y="864" class="body" style="fill:#c2a7ff;">Переходы через AppNav</text><path d="M80 902 L620 902" class="edge" stroke="#82b7ff" marker-end="url(#arrow-feature)"/><rect x="211.5" y="869" width="277.0" height="29" rx="6" fill="#0c1729" /><text x="222.5" y="889" class="small" style="fill:#82b7ff;">Library → Viewer(photoId)</text><path d="M990 902 L1840 902" class="edge" stroke="#82b7ff" marker-end="url(#arrow-feature)"/><rect x="1271.5" y="869" width="277.0" height="29" rx="6" fill="#0c1729" /><text x="1282.5" y="889" class="small" style="fill:#82b7ff;">Library → Builder(photos)</text><path d="M80 974 L620 974" class="edge" stroke="#82b7ff" marker-end="url(#arrow-feature)"/><rect x="211.5" y="941" width="277.0" height="29" rx="6" fill="#0c1729" /><text x="222.5" y="961" class="small" style="fill:#82b7ff;">Combos → Builder(comboId)</text><path d="M990 974 L1840 974" class="edge" stroke="#82b7ff" marker-end="url(#arrow-feature)"/><rect x="1266.4" y="941" width="287.2" height="29" rx="6" fill="#0c1729" /><text x="1277.4" y="961" class="small" style="fill:#82b7ff;">Combos → Builder() / новое</text><g class="note"><rect x="64" y="1025" width="872" height="220" rx="14" fill="#142238" stroke="#ec9fc9" class="note-bg" stroke-opacity=".35"/><text x="84" y="1058" class="body" style="fill:#ec9fc9;">Back: последний зарегистрированный обработчик</text><text x="84" y="1090" class="small" style="">Window Esc / BackKeyHost → BackDispatcher.dispatchBack().</text><text x="84" y="1116" class="small" style="">RegisterBackHandler: DisposableEffect + rememberUpdatedState.</text><text x="84" y="1142" class="small" style="">Диалог / режим выбора / Builder перехватывают back; иначе pop стека.</text><text x="84" y="1168" class="small" style="">Кнопки экрана также вызывают onBack. Регистрация снимается onDispose.</text></g><g class="note"><rect x="984" y="1025" width="872" height="220" rx="14" fill="#142238" stroke="#ffaaa0" class="note-bg" stroke-opacity=".35"/><text x="1004" y="1058" class="body" style="fill:#ffaaa0;">Публичный StateFlow не означает глубокую неизменяемость</text><text x="1004" y="1090" class="small" style="">Library хранит выбор; ComboList — список и статус экспорта.</text><text x="1004" y="1116" class="small" style="">Viewer держит pager/zoom в UI; Builder — viewport в ViewModel.</text><text x="1004" y="1142" class="small" style="">BuilderUiState.items содержит mutable ItemDraft; revision сигналит</text><text x="1004" y="1168" class="small" style="">об изменении. Новый copy() состояния не копирует сами драфты.</text></g></svg>