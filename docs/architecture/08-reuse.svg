" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b4d882" stroke-width="2"/></marker><marker id="inherit-core" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#b4d882" stroke-width="1.8"/></marker><marker id="arrow-ui" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ec9fc9" stroke-width="2"/></marker><marker id="inherit-ui" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ec9fc9" stroke-width="1.8"/></marker><marker id="arrow-test" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a7b8ce" stroke-width="2"/></marker><marker id="inherit-test" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a7b8ce" stroke-width="1.8"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ffaaa0" stroke-width="2"/></marker><marker id="inherit-risk" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ffaaa0" stroke-width="1.8"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#eef3fb" stroke-width="2"/></marker><marker id="inherit-ink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#eef3fb" stroke-width="1.8"/></marker><marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a4b4cc" stroke-width="2"/></marker><marker id="inherit-muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a4b4cc" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="1920" height="1380" rx="0" fill="#0b1526" /><rect width="1920" height="1380" fill="url(#paper)"/><rect width="1920" height="1380" fill="url(#grid)"/><rect x="64" y="60" width="6" height="94" rx="3" fill="#ec9fc9" /><text x="90" y="78" class="label" style="fill:#ec9fc9;">PHOTOCOMBO / ARCHITECTURE ATLAS</text><text x="88" y="132" class="title" style="">08 / Повторное использование и проверяемость</text><text x="90" y="173" class="subtitle" style="">Общий код выделен по функции: универсальный UI, предметные галереи, редакторские правила и платформенные порты.</text><path d="M64 207 L1856 207" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><path d="M64 1314 L1856 1314" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><text x="64" y="1349" class="small" style="">2026-11-14  •  source 7351a27b9daa  •  commonMain + desktopMain</text><a href="00-guide.svg"><text x="1530" y="1349" class="small">← Навигация по атласу</text></a><a href="../../design-system/src/commonMain/kotlin/com/combo/ui/common/designsystem/components/PcDialog.kt" target="_blank"><g class="card"><title>:design-system — REUSABLE COMPOSE LIBRARY | design-system/src/commonMain/kotlin/com/combo/ui/common/designsystem/components/PcDialog.kt</title><rect x="64" y="240" width="540" height="306" rx="18" fill="#122239" stroke="#ec9fc9" class="card-bg" stroke-opacity=".65"/><rect x="64" y="259" width="4" height="268" rx="2" fill="#ec9fc9" /><text x="86" y="272" class="label" style="fill:#ec9fc9;">REUSABLE COMPOSE LIBRARY</text><text x="86" y="309" class="body" style="font-size:24px;">:design-system</text><text x="86" y="343" class="body" style="">components → primitives → theme → tokens</text><text x="86" y="372" class="body" style="">icons независимы от предметной области.</text><text x="86" y="401" class="body" style="">PcButton / IconButton / ActionGroup</text><text x="86" y="430" class="body" style="">PcSelect / Slider / SegmentedControl</text><text x="86" y="459" class="body" style="">PcTextField / Checkbox / Tooltip / Dialog</text><text x="86" y="488" class="body" style="">PcOption&lt;T&gt;: значение / label / icon</text><text x="86" y="517" class="body" style="">PcPlatformDialog: internal expect/actual</text><text x="575" y="272" class="small" style="fill:#ec9fc9;">↗</text></g></a><a href="../../ui-common/src/commonMain/kotlin/com/combo/ui/common/PhotoGrid.kt" target="_blank"><g class="card"><title>:ui-common — SHARED APPLICATION UI | ui-common/src/commonMain/kotlin/com/combo/ui/common/PhotoGrid.kt</title><rect x="690" y="240" width="540" height="306" rx="18" fill="#122239" stroke="#ec9fc9" class="card-bg" stroke-opacity=".65"/><rect x="690" y="259" width="4" height="268" rx="2" fill="#ec9fc9" /><text x="712" y="272" class="label" style="fill:#ec9fc9;">SHARED APPLICATION UI</text><text x="712" y="309" class="body" style="font-size:24px;">:ui-common</text><text x="712" y="343" class="body" style="">GalleryGrid&lt;T&gt;: колонки и размеры ячеек.</text><text x="712" y="372" class="body" style="">PhotoGrid: PhotoEntity + ThumbImage.</text><text x="712" y="401" class="body" style="">GallerySizeControl + GalleryScaleState.</text><text x="712" y="430" class="body" style="">BackDispatcher / RegisterBackHandler.</text><text x="712" y="459" class="body" style="">BackKeyHost / KeyInputHost / BackNavIcon.</text><text x="712" y="488" class="body" style="">CollectMessages: Flow → Snackbar.</text><text x="712" y="517" class="body" style="">Знает domain/data; это не независимая DS.</text><text x="1201" y="272" class="small" style="fill:#ec9fc9;">↗</text></g></a><a href="../../domain/src/commonMain/kotlin/com/combo/domain/Repositories.kt" target="_blank"><g class="card"><title>:core и :domain — REUSE WITH DIFFERENT COUPLING | domain/src/commonMain/kotlin/com/combo/domain/Repositories.kt</title><rect x="1316" y="240" width="540" height="306" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65"/><rect x="1316" y="259" width="4" height="268" rx="2" fill="#b4d882" /><text x="1338" y="272" class="label" style="fill:#b4d882;">REUSE WITH DIFFERENT COUPLING</text><text x="1338" y="309" class="body" style="font-size:24px;">:core и :domain</text><text x="1338" y="343" class="body" style="">core.render: общая геометрия и draw.</text><text x="1338" y="372" class="body" style="">core.model: FramingMode без app imports.</text><text x="1338" y="401" class="body" style="">core.image/platform: заменяемые порты.</text><text x="1338" y="430" class="body" style="">domain: PhotoAssets без Koin.</text><text x="1338" y="459" class="body" style="">PhotoImporter: injected clock/id/IO.</text><text x="1338" y="488" class="body" style="">ComboPngExporter: injected PngOutput.</text><text x="1338" y="517" class="body" style="">domain связан с Room-сущностями data.</text><text x="1827" y="272" class="small" style="fill:#b4d882;">↗</text></g></a><text x="64" y="612" class="body" style="fill:#ec9fc9;">Что переиспользуется между фичами</text><rect x="64" y="648" width="1792" height="47" rx="9" fill="#122239" /><text x="84" y="679" class="body" style="fill:#82b7ff;">Library + Builder picker</text><text x="700" y="679" class="mono" style="">PhotoGrid → GalleryGrid&lt;T&gt; → ThumbImage</text><rect x="64" y="705" width="1792" height="47" rx="9" fill="#122239" /><text x="84" y="736" class="body" style="fill:#82b7ff;">Library + ComboList</text><text x="700" y="736" class="mono" style="">GalleryScaleState / GallerySizeControl</text><rect x="64" y="762" width="1792" height="47" rx="9" fill="#122239" /><text x="84" y="793" class="body" style="fill:#82b7ff;">Viewer + ComboList + Builder</text><text x="700" y="793" class="mono" style="">PhotoAssets → BitmapSource</text><rect x="64" y="819" width="1792" height="47" rx="9" fill="#122239" /><text x="84" y="850" class="body" style="fill:#82b7ff;">Builder + ComboList + PNG export</text><text x="700" y="850" class="mono" style="">buildItemFrame / effectiveFraming / drawCombo</text><rect x="64" y="876" width="1792" height="47" rx="9" fill="#122239" /><text x="84" y="907" class="body" style="fill:#82b7ff;">Все экраны</text><text x="700" y="907" class="mono" style="">PcTheme / Pc* + back/input helpers</text><a href="../../test-support/build.gradle.kts" target="_blank"><g class="card"><title>test-support — TEST-ONLY MODULE | test-support/build.gradle.kts</title><rect x="64" y="979" width="540" height="287" rx="18" fill="#122239" stroke="#a7b8ce" class="card-bg" stroke-opacity=".65"/><rect x="64" y="998" width="4" height="249" rx="2" fill="#a7b8ce" /><text x="86" y="1011" class="label" style="fill:#a7b8ce;">TEST-ONLY MODULE</text><text x="86" y="1048" class="body" style="font-size:24px;">test-support</text><text x="86" y="1082" class="body" style="">FakePhotoDao / FakeComboDao</text><text x="86" y="1111" class="body" style="">FakeLogger / CountingCodec</text><text x="86" y="1140" class="body" style="">FakePhotoRepository / FakeComboRepository</text><text x="86" y="1169" class="body" style="">StubBitmapSource / FakeImagePicker</text><text x="86" y="1198" class="body" style="">ImageFixtures / UiTestBase / TestBackHost</text><text x="86" y="1227" class="body" style="">Тесты используют временные каталоги.</text><text x="575" y="1011" class="small" style="fill:#a7b8ce;">↗</text></g></a><a href="../../build.gradle.kts" target="_blank"><g class="card"><title>Архитектурные проверки — SOURCE + MODULE GUARDS | build.gradle.kts</title><rect x="690" y="979" width="540" height="287" rx="18" fill="#122239" stroke="#a7b8ce" class="card-bg" stroke-opacity=".65"/><rect x="690" y="998" width="4" height="249" rx="2" fill="#a7b8ce" /><text x="712" y="1011" class="label" style="fill:#a7b8ce;">SOURCE + MODULE GUARDS</text><text x="712" y="1048" class="body" style="font-size:24px;">Архитектурные проверки</text><text x="712" y="1082" class="body" style="">verifyModuleGraph: точный Gradle-граф.</text><text x="712" y="1111" class="body" style="">ArchitectureRulesTest: imports / cycles.</text><text x="712" y="1140" class="body" style="">SourceHygieneTest: UTF-8 / LF / BOM.</text><text x="712" y="1169" class="body" style="">AppModulesTest: сборка графа Koin.</text><text x="712" y="1198" class="body" style="">AppNavViewModelTest: owner scope.</text><text x="712" y="1227" class="body" style="">Набор тестов не равен формальному proof.</text><text x="1201" y="1011" class="small" style="fill:#a7b8ce;">↗</text></g></a><a href="../../docs/DEVELOPMENT.md" target="_blank"><g class="card"><title>Контракты поведения — TESTS AS READING MAP | docs/DEVELOPMENT.md</title><rect x="1316" y="979" width="540" height="287" rx="18" fill="#122239" stroke="#a7b8ce" class="card-bg" stroke-opacity=".65"/><rect x="1316" y="998" width="4" height="249" rx="2" fill="#a7b8ce" /><text x="1338" y="1011" class="label" style="fill:#a7b8ce;">TESTS AS READING MAP</text><text x="1338" y="1048" class="body" style="font-size:24px;">Контракты поведения</text><text x="1338" y="1082" class="body" style="">ItemFrameParityTest / DrawCombo*Test</text><text x="1338" y="1111" class="body" style="">DraftMapperTest / DraftHistoryTest</text><text x="1338" y="1140" class="body" style="">ComboBuilderFinalizationTest</text><text x="1338" y="1169" class="body" style="">LruBitmapSourceTest / PhotoImporterTest</text><text x="1338" y="1198" class="body" style="">ComboPngExporterTest / MigrationTest</text><text x="1338" y="1227" class="body" style="">DesignSystem / Gallery / Gestures tests</text><text x="1827" y="1011" class="small" style="fill:#a7b8ce;">↗</text></g></a></svg>