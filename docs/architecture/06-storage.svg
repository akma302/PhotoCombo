" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b4d882" stroke-width="2"/></marker><marker id="inherit-core" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#b4d882" stroke-width="1.8"/></marker><marker id="arrow-ui" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ec9fc9" stroke-width="2"/></marker><marker id="inherit-ui" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ec9fc9" stroke-width="1.8"/></marker><marker id="arrow-test" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a7b8ce" stroke-width="2"/></marker><marker id="inherit-test" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a7b8ce" stroke-width="1.8"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ffaaa0" stroke-width="2"/></marker><marker id="inherit-risk" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#ffaaa0" stroke-width="1.8"/></marker><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#eef3fb" stroke-width="2"/></marker><marker id="inherit-ink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#eef3fb" stroke-width="1.8"/></marker><marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a4b4cc" stroke-width="2"/></marker><marker id="inherit-muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a4b4cc" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="1920" height="1380" rx="0" fill="#0b1526" /><rect width="1920" height="1380" fill="url(#paper)"/><rect width="1920" height="1380" fill="url(#grid)"/><rect x="64" y="60" width="6" height="94" rx="3" fill="#f0c175" /><text x="90" y="78" class="label" style="fill:#f0c175;">PHOTOCOMBO / ARCHITECTURE ATLAS</text><text x="88" y="132" class="title" style="">06 / Импорт, база и файлы</text><text x="90" y="173" class="subtitle" style="">Repository API оперирует PhotoEntity / ComboEntity / ComboItemEntity / ComboWithItems из :data.</text><path d="M64 207 L1856 207" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><path d="M64 1314 L1856 1314" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><text x="64" y="1349" class="small" style="">2026-11-14  •  source 7351a27b9daa  •  commonMain + desktopMain</text><a href="00-guide.svg"><text x="1530" y="1349" class="small">← Навигация по атласу</text></a><a href="../../core/src/desktopMain/kotlin/com/combo/core/image/DesktopImagePicker.kt" target="_blank"><g class="card"><title>Выбор файлов — ImagePicker → ImageSource | core/src/desktopMain/kotlin/com/combo/core/image/DesktopImagePicker.kt</title><rect x="64" y="240" width="412" height="236" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65"/><rect x="64" y="259" width="4" height="198" rx="2" fill="#b4d882" /><text x="86" y="272" class="label" style="fill:#b4d882;">ImagePicker → ImageSource</text><text x="86" y="309" class="body" style="font-size:24px;">Выбор файлов</text><text x="86" y="343" class="body" style="">DesktopImagePicker: native dialog.</text><text x="86" y="372" class="body" style="">FileImageSource.openSource()</text><text x="86" y="401" class="body" style="">открывает новый поток на чтение.</text><text x="447" y="272" class="small" style="fill:#b4d882;">↗</text></g></a><path d="M476 355 L517 355" class="edge flow" stroke="#f0c175" marker-end="url(#arrow-data)"/><a href="../../domain/src/commonMain/kotlin/com/combo/domain/PhotoImporter.kt" target="_blank"><g class="card"><title>Дедупликация — PhotoImporter • injected IO | domain/src/commonMain/kotlin/com/combo/domain/PhotoImporter.kt</title><rect x="524" y="240" width="412" height="236" rx="18" fill="#122239" stroke="#57ddc4" class="card-bg" stroke-opacity=".65"/><rect x="524" y="259" width="4" height="198" rx="2" fill="#57ddc4" /><text x="546" y="272" class="label" style="fill:#57ddc4;">PhotoImporter • injected IO</text><text x="546" y="309" class="body" style="font-size:24px;">Дедупликация</text><text x="546" y="343" class="body" style="">SHA-256 входного потока.</text><text x="546" y="372" class="body" style="">PhotoDao.findByHash(hash).</text><text x="546" y="401" class="body" style="">Дубликат пропускается.</text><text x="907" y="272" class="small" style="fill:#57ddc4;">↗</text></g></a><path d="M936 355 L977 355" class="edge flow" stroke="#f0c175" marker-end="url(#arrow-data)"/><a href="../../data/src/commonMain/kotlin/com/combo/data/PhotoStorage.kt" target="_blank"><g class="card"><title>Копия и EXIF — PhotoStorage + ImageCodec | data/src/commonMain/kotlin/com/combo/data/PhotoStorage.kt</title><rect x="984" y="240" width="412" height="236" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65"/><rect x="984" y="259" width="4" height="198" rx="2" fill="#b4d882" /><text x="1006" y="272" class="label" style="fill:#b4d882;">PhotoStorage + ImageCodec</text><text x="1006" y="309" class="body" style="font-size:24px;">Копия и EXIF</text><text x="1006" y="343" class="body" style="">Копирование в photos/&lt;id&gt;.&lt;ext&gt;.</text><text x="1006" y="372" class="body" style="">Bounds → orientation → normalize.</text><text x="1006" y="401" class="body" style="">Исходный выбранный файл не</text><text x="1006" y="430" class="body" style="">меняется.</text><text x="1367" y="272" class="small" style="fill:#b4d882;">↗</text></g></a><path d="M1396 355 L1437 355" class="edge flow" stroke="#f0c175" marker-end="url(#arrow-data)"/><a href="../../domain/src/commonMain/kotlin/com/combo/domain/PhotoImporter.kt" target="_blank"><g class="card"><title>Thumbnail и запись — PhotoDao.insert(PhotoEntity) | domain/src/commonMain/kotlin/com/combo/domain/PhotoImporter.kt</title><rect x="1444" y="240" width="412" height="236" rx="18" fill="#122239" stroke="#f0c175" class="card-bg" stroke-opacity=".65"/><rect x="1444" y="259" width="4" height="198" rx="2" fill="#f0c175" /><text x="1466" y="272" class="label" style="fill:#f0c175;">PhotoDao.insert(PhotoEntity)</text><text x="1466" y="309" class="body" style="font-size:24px;">Thumbnail и запись</text><text x="1466" y="343" class="body" style="">Один sample → avgColor + JPEG</text><text x="1466" y="372" class="body" style="">thumb.</text><text x="1466" y="401" class="body" style="">Строка БД добавляется после</text><text x="1466" y="430" class="body" style="">файлов.</text><text x="1466" y="459" class="body" style="">Сбой: best-effort уборка копий.</text><text x="1827" y="272" class="small" style="fill:#f0c175;">↗</text></g></a><a href="../../data/src/commonMain/kotlin/com/combo/data/Entities.kt" target="_blank"><g class="card"><title>PhotoEntity → photos — ROOM ENTITY • PK id | data/src/commonMain/kotlin/com/combo/data/Entities.kt</title><rect x="64" y="550" width="540" height="279" rx="18" fill="#122239" stroke="#f0c175" class="card-bg" stroke-opacity=".65"/><rect x="64" y="569" width="4" height="241" rx="2" fill="#f0c175" /><text x="86" y="582" class="label" style="fill:#f0c175;">ROOM ENTITY • PK id</text><text x="86" y="619" class="body" style="font-size:24px;">PhotoEntity → photos</text><text x="86" y="653" class="body" style="">fileName / originalName / mimeType</text><text x="86" y="682" class="body" style="">width / height / sizeBytes</text><text x="86" y="711" class="body" style="">sha256 UNIQUE / avgColor / importedAt</text><text x="86" y="740" class="body" style="">PhotoDao.all(): importedAt DESC</text><text x="86" y="769" class="body" style="">delete: precheck isPhotoUsed()</text><text x="86" y="798" class="body" style="">FK RESTRICT защищает используемое фото.</text><text x="575" y="582" class="small" style="fill:#f0c175;">↗</text></g></a><a href="../../data/src/commonMain/kotlin/com/combo/data/Entities.kt" target="_blank"><g class="card"><title>ComboItemEntity → combo_items — ROOM ENTITY • PK id | data/src/commonMain/kotlin/com/combo/data/Entities.kt</title><rect x="690" y="550" width="540" height="279" rx="18" fill="#122239" stroke="#f0c175" class="card-bg" stroke-opacity=".65"/><rect x="690" y="569" width="4" height="241" rx="2" fill="#f0c175" /><text x="712" y="582" class="label" style="fill:#f0c175;">ROOM ENTITY • PK id</text><text x="712" y="619" class="body" style="font-size:24px;">ComboItemEntity → combo_items</text><text x="712" y="653" class="body" style="">comboId → combos.id (CASCADE)</text><text x="712" y="682" class="body" style="">photoId → photos.id (RESTRICT)</text><text x="712" y="711" class="body" style="">zIndex / center / width / height</text><text x="712" y="740" class="body" style="">rotation / framingMode: String</text><text x="712" y="769" class="body" style="">contentScale / panX / panY</text><text x="712" y="798" class="body" style="">Одна рамка содержит ровно одно фото.</text><text x="1201" y="582" class="small" style="fill:#f0c175;">↗</text></g></a><a href="../../data/src/commonMain/kotlin/com/combo/data/Daos.kt" target="_blank"><g class="card"><title>ComboEntity → combos — ROOM ENTITY • PK id | data/src/commonMain/kotlin/com/combo/data/Daos.kt</title><rect x="1316" y="550" width="540" height="279" rx="18" fill="#122239" stroke="#f0c175" class="card-bg" stroke-opacity=".65"/><rect x="1316" y="569" width="4" height="241" rx="2" fill="#f0c175" /><text x="1338" y="582" class="label" style="fill:#f0c175;">ROOM ENTITY • PK id</text><text x="1338" y="619" class="body" style="font-size:24px;">ComboEntity → combos</text><text x="1338" y="653" class="body" style="">name / canvasWidth / canvasHeight</text><text x="1338" y="682" class="body" style="">background: BackgroundSpec → JSON</text><text x="1338" y="711" class="body" style="">createdAt / updatedAt</text><text x="1338" y="740" class="body" style="">ComboWithItems: Embedded + Relation</text><text x="1338" y="769" class="body" style="">ComboDao.all(): updatedAt DESC</text><text x="1338" y="798" class="body" style="">Репозиторий сортирует items по zIndex.</text><text x="1827" y="582" class="small" style="fill:#f0c175;">↗</text></g></a><path d="M690 680 L610 680" class="edge" stroke="#f0c175" marker-end="url(#arrow-data)"/><rect x="603.0" y="630" width="90" height="29" rx="6" fill="#0c1729" /><text x="614.0" y="650" class="small" style="fill:#f0c175;">N → 1</text><path d="M1230 680 L1310 680" class="edge" stroke="#f0c175" marker-end="url(#arrow-data)"/><rect x="1227.0" y="630" width="90" height="29" rx="6" fill="#0c1729" /><text x="1238.0" y="650" class="small" style="fill:#f0c175;">N → 1</text><a href="../../data/src/desktopMain/kotlin/com/combo/data/DatabaseFactory.kt" target="_blank"><g class="card"><title>AppDb / createAppDb() — ABSTRACT CLASS + DESKTOP FACTORY | data/src/desktopMain/kotlin/com/combo/data/DatabaseFactory.kt</title><rect x="64" y="900" width="540" height="246" rx="18" fill="#122239" stroke="#f0c175" class="card-bg" stroke-opacity=".65"/><rect x="64" y="919" width="4" height="208" rx="2" fill="#f0c175" /><text x="86" y="932" class="label" style="fill:#f0c175;">ABSTRACT CLASS + DESKTOP FACTORY</text><text x="86" y="969" class="body" style="font-size:24px;">AppDb / createAppDb()</text><text x="86" y="1003" class="body" style="">Room schema v2; BundledSQLiteDriver.</text><text x="86" y="1032" class="body" style="">queries → Dispatchers.IO.</text><text x="86" y="1061" class="body" style="">MIGRATION_1_2: фото перенесено в item.</text><text x="86" y="1090" class="body" style="">При старых нескольких фото остаётся</text><text x="86" y="1119" class="body" style="">первое по orderIndex, затем id.</text><text x="575" y="932" class="small" style="fill:#f0c175;">↗</text></g></a><a href="../../core/src/desktopMain/kotlin/com/combo/core/platform/DefaultAppDataDir.kt" target="_blank"><g class="card"><title>%APPDATA% / PhotoCombo — PERSISTENT • AppDirs | core/src/desktopMain/kotlin/com/combo/core/platform/DefaultAppDataDir.kt</title><rect x="690" y="900" width="540" height="246" rx="18" fill="#122239" stroke="#f0c175" class="card-bg" stroke-opacity=".65"/><rect x="690" y="919" width="4" height="208" rx="2" fill="#f0c175" /><text x="712" y="932" class="label" style="fill:#f0c175;">PERSISTENT • AppDirs</text><text x="712" y="969" class="body" style="font-size:24px;">%APPDATA% / PhotoCombo</text><text x="712" y="1003" class="body" style="">combo.db: конфигурация и метаданные.</text><text x="712" y="1032" class="body" style="">photos/: библиотечные копии.</text><text x="712" y="1061" class="body" style="">thumbs/: JPEG-миниатюры.</text><text x="712" y="1090" class="body" style="">gallery-settings.json: размер сеток.</text><text x="712" y="1119" class="body" style="">Файловые пути централизует PhotoStorage.</text><text x="1201" y="932" class="small" style="fill:#f0c175;">↗</text></g></a><a href="../../domain/src/commonMain/kotlin/com/combo/domain/GallerySettingsRepository.kt" target="_blank"><g class="card"><title>Настройки галерей — GallerySettingsRepositoryImpl | domain/src/commonMain/kotlin/com/combo/domain/GallerySettingsRepository.kt</title><rect x="1316" y="900" width="540" height="246" rx="18" fill="#122239" stroke="#57ddc4" class="card-bg" stroke-opacity=".65"/><rect x="1316" y="919" width="4" height="208" rx="2" fill="#57ddc4" /><text x="1338" y="932" class="label" style="fill:#57ddc4;">GallerySettingsRepositoryImpl</text><text x="1338" y="969" class="body" style="font-size:24px;">Настройки галерей</text><text x="1338" y="1003" class="body" style="">Mutex сериализует load / saveScale.</text><text x="1338" y="1032" class="body" style="">current — кеш в памяти; Photos / Combos.</text><text x="1338" y="1061" class="body" style="">FileGallerySettingsStorage: .tmp</text><text x="1338" y="1090" class="body" style="">→ atomicMove; диапазон 50…200%.</text><text x="1338" y="1119" class="body" style="">Сбой диска: выбор остаётся в памяти.</text><text x="1827" y="932" class="small" style="fill:#57ddc4;">↗</text></g></a><g class="note"><rect x="64" y="1190" width="1792" height="100" rx="14" fill="#142238" stroke="#ffaaa0" class="note-bg" stroke-opacity=".35"/><text x="84" y="1223" class="body" style="fill:#ffaaa0;">Формат данных — контракт совместимости</text><text x="84" y="1255" class="small" style="">Имена FramingMode сохраняются через .name/valueOf. BackgroundSpec использует сериализованные типы auto/solid и id стратегии.</text><text x="84" y="1281" class="small" style="">Транзакция Room не охватывает файлы импорта. Удаление файлов best-effort; новая схема требует миграции и MigrationTest.</text></g></svg>