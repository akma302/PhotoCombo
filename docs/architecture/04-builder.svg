marker><marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a4b4cc" stroke-width="2"/></marker><marker id="inherit-muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L12 7 L1 13 Z" fill="#101e32" stroke="#a4b4cc" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="1920" height="1380" rx="0" fill="#0b1526" /><rect width="1920" height="1380" fill="url(#paper)"/><rect width="1920" height="1380" fill="url(#grid)"/><rect x="64" y="60" width="6" height="94" rx="3" fill="#82b7ff" /><text x="90" y="78" class="label" style="fill:#82b7ff;">PHOTOCOMBO / ARCHITECTURE ATLAS</text><text x="88" y="132" class="title" style="">04 / Редактор: события, мутации и снимки</text><text x="90" y="173" class="subtitle" style="">Три разных формы данных: mutable ItemDraft → immutable-by-convention ItemSnap / ComboSnap → Room entities.</text><path d="M64 207 L1856 207" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><path d="M64 1314 L1856 1314" stroke="#a7b8ce" stroke-width="1.5" opacity=".35"/><text x="64" y="1349" class="small" style="">2026-11-14  •  source 7351a27b9daa  •  commonMain + desktopMain</text><a href="00-guide.svg"><text x="1530" y="1349" class="small">← Навигация по атласу</text></a><a href="../../feature/builder/src/commonMain/kotlin/com/combo/feature/builder/EditorGestures.kt" target="_blank"><g class="card"><title>Ввод и панели — UI • В ОСНОВНОМ INTERNAL | feature/builder/src/commonMain/kotlin/com/combo/feature/builder/EditorGestures.kt</title><rect x="64" y="240" width="540" height="217" rx="18" fill="#122239" stroke="#ec9fc9" class="card-bg" stroke-opacity=".65"/><rect x="64" y="259" width="4" height="179" rx="2" fill="#ec9fc9" /><text x="86" y="272" class="label" style="fill:#ec9fc9;">UI • В ОСНОВНОМ INTERNAL</text><text x="86" y="309" class="body" style="font-size:24px;">Ввод и панели</text><text x="86" y="343" class="body" style="">editorGestures / classifyGesture / nearEdge</text><text x="86" y="372" class="body" style="">editorWheelZoom / BuilderInspector</text><text x="86" y="401" class="body" style="">BuilderTopBar / BuilderCanvasToolbar</text><text x="86" y="430" class="body" style="">BuilderViewControls / диалоги</text><text x="575" y="272" class="small" style="fill:#ec9fc9;">↗</text></g></a><a href="../../feature/builder/src/commonMain/kotlin/com/combo/feature/builder/BuilderContract.kt" target="_blank"><g class="card"><title>BuilderEvent → onEvent() — PUBLIC • VIEWMODEL | feature/builder/src/commonMain/kotlin/com/combo/feature/builder/BuilderContract.kt</title><rect x="690" y="240" width="540" height="217" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="690" y="259" width="4" height="179" rx="2" fill="#82b7ff" /><text x="712" y="272" class="label" style="fill:#82b7ff;">PUBLIC • VIEWMODEL</text><text x="712" y="309" class="body" style="font-size:24px;">BuilderEvent → onEvent()</text><text x="712" y="343" class="body" style="">ItemPressed / SnapDrag / PointerEditFinished</text><text x="712" y="372" class="body" style="">ContentPan / ContentZoom / BorderResize</text><text x="712" y="401" class="body" style="">AddItems / ReplacePhoto / SetAspect</text><text x="712" y="430" class="body" style="">Undo / Redo / Save / ViewportZoom</text><text x="1201" y="272" class="small" style="fill:#82b7ff;">↗</text></g></a><a href="../../feature/builder/src/commonMain/kotlin/com/combo/feature/builder/BuilderContract.kt" target="_blank"><g class="card"><title>BuilderUiState — PUBLIC • ENTRY STATE | feature/builder/src/commonMain/kotlin/com/combo/feature/builder/BuilderContract.kt</title><rect x="1316" y="240" width="540" height="217" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="1316" y="259" width="4" height="179" rx="2" fill="#82b7ff" /><text x="1338" y="272" class="label" style="fill:#82b7ff;">PUBLIC • ENTRY STATE</text><text x="1338" y="309" class="body" style="font-size:24px;">BuilderUiState</text><text x="1338" y="343" class="body" style="">items + photos + selectedItemId</text><text x="1338" y="372" class="body" style="">canvasW/H + background + name</text><text x="1338" y="401" class="body" style="">viewport + revision + isDirty</text><text x="1338" y="430" class="body" style="">canUndo/Redo + saving + loaded</text><text x="1827" y="272" class="small" style="fill:#82b7ff;">↗</text></g></a><path d="M604 348 L684 348" class="edge" stroke="#82b7ff" marker-end="url(#arrow-feature)"/><path d="M1230 348 L1310 348" class="edge flow" stroke="#82b7ff" marker-end="url(#arrow-feature)"/><path d="M870 457 L870 510" class="edge" stroke="#b4d882" marker-end="url(#arrow-core)"/><a href="../../feature/builder/src/commonMain/kotlin/com/combo/feature/builder/history/DraftHistory.kt" target="_blank"><g class="card"><title>DraftHistory — INTERNAL CLASS • OWNED BY VM | feature/builder/src/commonMain/kotlin/com/combo/feature/builder/history/DraftHistory.kt</title><rect x="64" y="510" width="540" height="275" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="64" y="529" width="4" height="237" rx="2" fill="#82b7ff" /><text x="86" y="542" class="label" style="fill:#82b7ff;">INTERNAL CLASS • OWNED BY VM</text><text x="86" y="579" class="body" style="font-size:24px;">DraftHistory</text><text x="86" y="613" class="body" style="">begin(): снимок до мутации</text><text x="86" y="642" class="body" style="">end(): сравнение → один checkpoint</text><text x="86" y="671" class="body" style="">cancel(): restore(pending), без шага</text><text x="86" y="700" class="body" style="">checkpoint(): кнопочные операции</text><text x="86" y="729" class="body" style="">UndoStack&lt;ComboSnap&gt;: 50 шагов</text><text x="86" y="758" class="body" style="">snapshot / restore переданы лямбдами</text><text x="575" y="542" class="small" style="fill:#82b7ff;">↗</text></g></a><a href="../../feature/builder/src/commonMain/kotlin/com/combo/feature/builder/draft/DraftEditor.kt" target="_blank"><g class="card"><title>DraftEditor + core rules — INTERNAL OBJECT + PUBLIC CORE | feature/builder/src/commonMain/kotlin/com/combo/feature/builder/draft/DraftEditor.kt</title><rect x="690" y="510" width="540" height="275" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65"/><rect x="690" y="529" width="4" height="237" rx="2" fill="#b4d882" /><text x="712" y="542" class="label" style="fill:#b4d882;">INTERNAL OBJECT + PUBLIC CORE</text><text x="712" y="579" class="body" style="font-size:24px;">DraftEditor + core rules</text><text x="712" y="613" class="body" style="">moveToFront / deleteItem / addItems</text><text x="712" y="642" class="body" style="">replacePhoto / applyPreset</text><text x="712" y="671" class="body" style="">applyFramingMode / newComboDrafts</text><text x="712" y="700" class="body" style="">ItemGestures: движение / resize / zoom</text><text x="712" y="729" class="body" style="">FrameSnap: MoveFrame / PanPhoto / Resize</text><text x="712" y="758" class="body" style="">relayout: изменение формата холста</text><text x="1201" y="542" class="small" style="fill:#b4d882;">↗</text></g></a><a href="../../core/src/commonMain/kotlin/com/combo/core/render/Drafts.kt" target="_blank"><g class="card"><title>ItemDraft — PUBLIC CLASS • MUTABLE | core/src/commonMain/kotlin/com/combo/core/render/Drafts.kt</title><rect x="1316" y="510" width="540" height="275" rx="18" fill="#122239" stroke="#b4d882" class="card-bg" stroke-opacity=".65"/><rect x="1316" y="529" width="4" height="237" rx="2" fill="#b4d882" /><text x="1338" y="542" class="label" style="fill:#b4d882;">PUBLIC CLASS • MUTABLE</text><text x="1338" y="579" class="body" style="font-size:24px;">ItemDraft</text><text x="1338" y="613" class="body" style="">id: val; геометрия и фото: var</text><text x="1338" y="642" class="body" style="">framingMode, contentScale, panX/Y</text><text x="1338" y="671" class="body" style="">VM меняет драфт → emitRevision()</text><text x="1338" y="700" class="body" style="">UI наблюдает state + bitmaps</text><text x="1338" y="729" class="body" style="">frameFor() → buildItemFrame()</text><text x="1338" y="758" class="body" style="">EditorCanvas вызывает drawCombo()</text><text x="1827" y="542" class="small" style="fill:#b4d882;">↗</text></g></a><path d="M690 635 L610 635" class="edge" stroke="#82b7ff" marker-end="url(#arrow-feature)"/><rect x="586.0" y="593" width="124.0" height="29" rx="6" fill="#0c1729" /><text x="597.0" y="613" class="small" style="fill:#82b7ff;">checkpoint</text><path d="M1230 635 L1310 635" class="edge" stroke="#b4d882" marker-end="url(#arrow-core)"/><a href="../../feature/builder/src/commonMain/kotlin/com/combo/feature/builder/draft/ComboSnap.kt" target="_blank"><g class="card"><title>ComboSnap + ItemSnap — INTERNAL DATA CLASSES | feature/builder/src/commonMain/kotlin/com/combo/feature/builder/draft/ComboSnap.kt</title><rect x="64" y="850" width="540" height="217" rx="18" fill="#122239" stroke="#f0c175" class="card-bg" stroke-opacity=".65"/><rect x="64" y="869" width="4" height="179" rx="2" fill="#f0c175" /><text x="86" y="882" class="label" style="fill:#f0c175;">INTERNAL DATA CLASSES</text><text x="86" y="919" class="body" style="font-size:24px;">ComboSnap + ItemSnap</text><text x="86" y="953" class="body" style="">Копия каждого поля рамки.</text><text x="86" y="982" class="body" style="">Размеры холста + фон + список снимков.</text><text x="86" y="1011" class="body" style="">Имя, viewport, выделение — вне Undo.</text><text x="86" y="1040" class="body" style="">Равенство снимков фильтрует пустой жест.</text><text x="575" y="882" class="small" style="fill:#f0c175;">↗</text></g></a><a href="../../feature/builder/src/commonMain/kotlin/com/combo/feature/builder/draft/FinalizeCanvas.kt" target="_blank"><g class="card"><title>Сохранение отдельной копии — PRIVATE save() • IO AFTER SNAPSHOT | feature/builder/src/commonMain/kotlin/com/combo/feature/builder/draft/FinalizeCanvas.kt</title><rect x="690" y="850" width="540" height="217" rx="18" fill="#122239" stroke="#f0c175" class="card-bg" stroke-opacity=".65"/><rect x="690" y="869" width="4" height="179" rx="2" fill="#f0c175" /><text x="712" y="882" class="label" style="fill:#f0c175;">PRIVATE save() • IO AFTER SNAPSHOT</text><text x="712" y="919" class="body" style="font-size:24px;">Сохранение отдельной копии</text><text x="712" y="953" class="body" style="">snapshot().trimmedToPhotos(photos)</text><text x="712" y="982" class="body" style="">toDraft() → toEntities(comboId)</text><text x="712" y="1011" class="body" style="">ComboRepository.saveCombo()</text><text x="712" y="1040" class="body" style="">saved → экран вызывает onBack()</text><text x="1201" y="882" class="small" style="fill:#f0c175;">↗</text></g></a><a href="../../feature/builder/src/commonMain/kotlin/com/combo/feature/builder/ViewportController.kt" target="_blank"><g class="card"><title>Viewport и snap-сессия — LOCAL EDITOR CONCERNS | feature/builder/src/commonMain/kotlin/com/combo/feature/builder/ViewportController.kt</title><rect x="1316" y="850" width="540" height="217" rx="18" fill="#122239" stroke="#82b7ff" class="card-bg" stroke-opacity=".65"/><rect x="1316" y="869" width="4" height="179" rx="2" fill="#82b7ff" /><text x="1338" y="882" class="label" style="fill:#82b7ff;">LOCAL EDITOR CONCERNS</text><text x="1338" y="919" class="body" style="font-size:24px;">Viewport и snap-сессия</text><text x="1338" y="953" class="body" style="">Viewport.zoomedAround() → новый value.</text><text x="1338" y="982" class="body" style="">Pan / zoom вида не меняют Undo.</text><text x="1338" y="1011" class="body" style="">private SnapSession: один pointer edit.</text><text x="1338" y="1040" class="body" style="">Capture/release: 5/8 dp → px → canvas.</text><text x="1827" y="882" class="small" style="fill:#82b7ff;">↗</text></g></a><path d="M334 785 L334 844" class="edge" stroke="#82b7ff" stroke-dasharray="7 6" marker-end="url(#arrow-feature)"/><path d="M604 955 L684 955" class="edge" stroke="#f0c175" marker-end="url(#arrow-data)"/><rect x="594.2" y="906" width="103.6" height="29" rx="6" fill="#0c1729" /><text x="605.2" y="926" class="small" style="fill:#f0c175;">snapshot</text><g class="note"><rect x="64" y="1120" width="1792" height="150" rx="14" fill="#142238" stroke="#b4d882" class="note-bg" stroke-opacity=".35"/><text x="84" y="1153" class="body" style="fill:#b4d882;">Инварианты, которые удерживают поведение</text><text x="84" y="1185" class="small" style="">CANCEL возвращает START без checkpoint. Save читает драфты до перехода на IO; обрезка не мутирует рабочий холст и историю.</text><text x="84" y="1211" class="small" style="">DraftMapperTest проверяет поля ItemDraft ↔ ItemSnap. Finalization/History-тесты проверяют неудачное сохранение и отмену.</text><text x="84" y="1237" class="small" style="">FitPreset.FIT/FILL — разовые операции; FramingMode.FIT — пересчитываемый режим. Это разные сущности и разные обязанности.</text></g></svg>